ila","f":"**IV** — PAO, polialfaolefinas: moléculas fabricadas en planta, todas iguales. Rango de temperatura muy amplio. — Sintético real","cols":["Grupo","Qué es","Se vende como"],"cells":["**IV**","PAO, polialfaolefinas: moléculas fabricadas en planta, todas iguales. Rango de temperatura muy amplio.","Sintético real"],"h3":"La base: cinco grupos"},{"id":"lu2.10","t":"fila","f":"**V** — Todo lo demás: ésteres, siliconas, poliglicoles. Es la base de los aceites de competición. — Sintético especial","cols":["Grupo","Qué es","Se vende como"],"cells":["**V**","Todo lo demás: ésteres, siliconas, poliglicoles. Es la base de los aceites de competición.","Sintético especial"],"h3":"La base: cinco grupos"},{"id":"lu2.11","t":"nota","f":"Un \"100 % sintético\" de Grupo III y uno de Grupo IV no son lo mismo. El III sale del petróleo con refinado severo; el IV se fabrica molécula por molécula. Por eso dos sintéticos pueden costar muy distinto y ambos decir la verdad.","lbl":"El detalle que nadie aclara en el mostrador","k":"err","h3":"La base: cinco grupos"}],"preguntas":[{"id":"11-L02-P1","tipo":"opcion","enunciado":"¿De qué está hecho un lubricante?","opciones":["De una base y un paquete de aditivos","Solo de aceite mineral refinado","De aceite y agua desmineralizada","De base sintética y grasa"],"correcta":0,"cita":"Dos cosas, nada más: una base y un paquete de aditivos.","fuente":{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho","bloque":"lu2.1"}},{"id":"11-L02-P2","tipo":"opcion","enunciado":"¿Qué parte de un lubricante es aceite base?","opciones":["Entre el 70 y el 90 %","Entre el 10 y el 30 %","La mitad exacta","Menos del 10 %"],"correcta":0,"cita":"70–90 % Aceite base — el cuerpo del producto","fuente":{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho","bloque":"lu2.2"}},{"id":"11-L02-P3","tipo":"emparejar","enunciado":"Empareja cada grupo de base con cómo se vende.","pares":[["Grupos I y II","Mineral"],["Grupo III","Sintético comercial"],["Grupo IV (PAO)","Sintético real"],["Grupo V (ésteres)","Sintético especial"]],"cita":"I — Refinado con solventes. Menos del 90 % de saturados, índice de viscosidad 90–105. El más básico y económico. — Mineral · II — Hidrotratado. Más del 90 % de saturados, menos de 0,03 % de azufre. Incoloro y más resistente a la oxidación. — Mineral · III — Hidrotratamiento severo. Índice de viscosidad sobre 120. Es mineral de origen, pero la industria lo vende como sintético. — Sintético comercial · IV — PAO, polialfaolefinas: moléculas fabricadas en planta, todas iguales. Rango de temperatura muy amplio. — Sintético real · V — Todo lo demás: ésteres, siliconas, poliglicoles. Es la base de los aceites de competición. — Sintético especial","fuente":{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho › La base: cinco grupos","bloques":["lu2.6","lu2.7","lu2.8","lu2.9","lu2.10"]}},{"id":"11-L02-P4","tipo":"vf","enunciado":"Un «100 % sintético» de Grupo III y uno de Grupo IV son exactamente lo mismo.","correcta":false,"cita":"Un \"100 % sintético\" de Grupo III y uno de Grupo IV no son lo mismo.","fuente":{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho › La base: cinco grupos","bloque":"lu2.11"}},{"id":"11-L02-P5","tipo":"opcion","enunciado":"¿Qué es una base de Grupo III?","opciones":["Mineral de origen con hidrotratamiento severo, que la industria vende como sintético","Moléculas fabricadas en planta, todas iguales (PAO)","Ésteres y siliconas de competición","Refinado con solventes, el más básico y económico"],"correcta":0,"cita":"Es mineral de origen, pero la industria lo vende como sintético.","fuente":{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho › La base: cinco grupos","bloque":"lu2.8"}}]},{"id":"11-L03","titulo":"Los aditivos y por qué se gastan","palabras":207,"minutos":2,"fuentes":[{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho"}],"cuerpo":[{"id":"lu2.12","t":"h3","f":"Los aditivos: qué hace cada uno","h3":"Los aditivos: qué hace cada uno"},{"id":"lu2.13","t":"fila","f":"**Detergentes** — Mantienen limpias las piezas metálicas y neutralizan los ácidos de la combustión.","cols":["Aditivo","Para qué sirve"],"cells":["**Detergentes**","Mantienen limpias las piezas metálicas y neutralizan los ácidos de la combustión."],"h3":"Los aditivos: qué hace cada uno"},{"id":"lu2.14","t":"fila","f":"**Dispersantes** — Mantienen el hollín en suspensión fina para que no se junte ni se deposite. Son los que evitan los lodos.","cols":["Aditivo","Para qué sirve"],"cells":["**Dispersantes**","Mantienen el hollín en suspensión fina para que no se junte ni se deposite. Son los que evitan los lodos."],"h3":"Los aditivos: qué hace cada uno"},{"id":"lu2.15","t":"fila","f":"**Antidesgaste** — Forman película protectora donde la presión es tan alta que el aceite solo no alcanza. El más conocido es el ZDDP.","cols":["Aditivo","Para qué sirve"],"cells":["**Antidesgaste**","Forman película protectora donde la presión es tan alta que el aceite solo no alcanza. El más conocido es el ZDDP."],"h3":"Los aditivos: qué hace cada uno"},{"id":"lu2.16","t":"fila","f":"**Antioxidantes** — Frenan el envejecimiento del aceite por calor y oxígeno. Retrasan ácidos y lodos.","cols":["Aditivo","Para qué sirve"],"cells":["**Antioxidantes**","Frenan el envejecimiento del aceite por calor y oxígeno. Retrasan ácidos y lodos."],"h3":"Los aditivos: qué hace cada uno"},{"id":"lu2.17","t":"fila","f":"**Mejoradores del índice de viscosidad** — Polímeros que evitan que el aceite se adelgace al calentarse. **Son los que hacen posible un multigrado.**","cols":["Aditivo","Para qué sirve"],"cells":["**Mejoradores del índice de viscosidad**","Polímeros que evitan que el aceite se adelgace al calentarse. **Son los que hacen posible un multigrado.**"],"h3":"Los aditivos: qué hace cada uno"},{"id":"lu2.18","t":"fila","f":"**Modificadores de fricción** — Reducen fricción para ahorrar combustible. Son los que hacen patinar un embrague húmedo de moto.","cols":["Aditivo","Para qué sirve"],"cells":["**Modificadores de fricción**","Reducen fricción para ahorrar combustible. Son los que hacen patinar un embrague húmedo de moto."],"h3":"Los aditivos: qué hace cada uno"},{"id":"lu2.19","t":"fila","f":"**Inhibidores de corrosión** — Neutralizan ácidos y forman barrera contra la humedad sobre el metal.","cols":["Aditivo","Para qué sirve"],"cells":["**Inhibidores de corrosión**","Neutralizan ácidos y forman barrera contra la humedad sobre el metal."],"h3":"Los aditivos: qué hace cada uno"},{"id":"lu2.20","t":"fila","f":"**Antiespumantes** — Revientan las burbujas. Un aceite con espuma no forma película y no lubrica.","cols":["Aditivo","Para qué sirve"],"cells":["**Antiespumantes**","Revientan las burbujas. Un aceite con espuma no forma película y no lubrica."],"h3":"Los aditivos: qué hace cada uno"},{"id":"lu2.21","t":"fila","f":"**Depresores del punto de fluidez** — Impiden que la cera cristalice en frío, para que el aceite siga fluyendo.","cols":["Aditivo","Para qué sirve"],"cells":["**Depresores del punto de fluidez**","Impiden que la cera cristalice en frío, para que el aceite siga fluyendo."],"h3":"Los aditivos: qué hace cada uno"},{"id":"lu2.22","t":"nota","f":"El aceite no se \"gasta\" como la gasolina: **lo que se agota es el paquete de aditivos**. Los detergentes se consumen, los dispersantes se saturan de hollín, los antioxidantes se acaban. Queda base sin propiedades. Por eso hay intervalo de cambio.","lbl":"Por qué esto vende","k":"key","h3":"Los aditivos: qué hace cada uno"}],"preguntas":[{"id":"11-L03-P1","tipo":"emparejar","enunciado":"Empareja cada aditivo con para qué sirve.","pares":[["Dispersantes","Mantienen el hollín en suspensión y evitan los lodos"],["Antidesgaste (ZDDP)","Película donde la presión es tan alta que el aceite solo no alcanza"],["Antiespumantes","Revientan las burbujas"],["Depresores del punto de fluidez","Impiden que la cera cristalice en frío"]],"cita":"Dispersantes — Mantienen el hollín en suspensión fina para que no se junte ni se deposite. Son los que evitan los lodos. · Antidesgaste — Forman película protectora donde la presión es tan alta que el aceite solo no alcanza. El más conocido es el ZDDP. · Antiespumantes — Revientan las burbujas. Un aceite con espuma no forma película y no lubrica. · Depresores del punto de fluidez — Impiden que la cera cristalice en frío, para que el aceite siga fluyendo.","fuente":{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho › Los aditivos: qué hace cada uno","bloques":["lu2.14","lu2.15","lu2.20","lu2.21"]}},{"id":"11-L03-P2","tipo":"opcion","enunciado":"¿Qué aditivo hace posible un multigrado?","opciones":["Los mejoradores del índice de viscosidad","Los detergentes","Los antiespumantes","Los inhibidores de corrosión"],"correcta":0,"cita":"Son los que hacen posible un multigrado.","fuente":{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho › Los aditivos: qué hace cada uno","bloque":"lu2.17"}},{"id":"11-L03-P3","tipo":"vf","enunciado":"Los modificadores de fricción ahorran combustible, pero hacen patinar el embrague húmedo de una moto.","correcta":true,"cita":"Son los que hacen patinar un embrague húmedo de moto.","fuente":{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho › Los aditivos: qué hace cada uno","bloque":"lu2.18"}},{"id":"11-L03-P4","tipo":"opcion","enunciado":"¿Por qué el aceite tiene intervalo de cambio?","opciones":["Porque se agota el paquete de aditivos y queda base sin propiedades","Porque el aceite se evapora como la gasolina","Porque el filtro se vuelve más fino","Porque la base cambia de color"],"correcta":0,"cita":"lo que se agota es el paquete de aditivos","fuente":{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho › Los aditivos: qué hace cada uno","bloque":"lu2.22"}},{"id":"11-L03-P5","tipo":"vf","enunciado":"Los detergentes mantienen limpias las piezas y además neutralizan los ácidos de la combustión.","correcta":true,"cita":"Mantienen limpias las piezas metálicas y neutralizan los ácidos de la combustión.","fuente":{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho › Los aditivos: qué hace cada uno","bloque":"lu2.13"}}]}]},{"id":"11-M03","titulo":"El motor por dentro","lecciones":[{"id":"11-L04","titulo":"El ciclo de cuatro tiempos","palabras":183,"minutos":2,"fuentes":[{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor"}],"cuerpo":[{"id":"lu5.1","t":"p","f":"Para vender lubricante hay que saber dónde va a parar. Esto es lo mínimo.","cls":"lead"},{"id":"lu5.2","t":"h3","f":"El ciclo de cuatro tiempos","h3":"El ciclo de cuatro tiempos"},{"id":"lu5.3","t":"p","f":"Cuatro carreras del pistón, dos vueltas completas del cigüeñal. Una sola de las cuatro genera potencia.","h3":"El ciclo de cuatro tiempos","cls":"what"},{"id":"lu5.4","t":"dato","f":"TIEMPO 1 · **Admisión** — Se abre la válvula de admisión y entra la mezcla de aire y combustible al cilindro. Pistón baja · admisión abierta","h3":"El ciclo de cuatro tiempos","h4":"Admisión"},{"id":"lu5.5","t":"dato","f":"TIEMPO 2 · **Compresión** — Ambas válvulas cerradas. El pistón sube y comprime la mezcla, que se calienta y queda lista para encender. Pistón sube · válvulas cerradas","h3":"El ciclo de cuatro tiempos","h4":"Compresión"},{"id":"lu5.6","t":"dato","f":"TIEMPO 3 · **Expansión** — Salta la chispa (o se inyecta el diésel), la mezcla explota y empuja el pistón. **Es el único tiempo que produce fuerza.** Pistón baja · válvulas cerradas","h3":"El ciclo de cuatro tiempos","h4":"Expansión"},{"id":"lu5.7","t":"dato","f":"TIEMPO 4 · **Escape** — Se abre la válvula de escape y el pistón, al subir, expulsa los gases quemados. Pistón sube · escape abierto","h3":"El ciclo de cuatro tiempos","h4":"Escape"},{"id":"lu5.8","t":"nota","f":"Todo el rato. El pistón sube y baja miles de veces por minuto, el cigüeñal gira sobre cojinetes, las válvulas abren y cierran. **Nada toca metal con metal gracias a la película de aceite.** Y en la explosión el aceite además se lleva el calor.","lbl":"Dónde entra el lubricante","k":"key","h3":"El ciclo de cuatro tiempos"}],"preguntas":[{"id":"11-L04-P1","tipo":"opcion","enunciado":"¿Cuál es el único tiempo del motor que produce fuerza?","opciones":["Expansión","Admisión","Compresión","Escape"],"correcta":0,"cita":"Es el único tiempo que produce fuerza.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El ciclo de cuatro tiempos","bloque":"lu5.6"}},{"id":"11-L04-P2","tipo":"emparejar","enunciado":"Empareja cada tiempo con lo que pasa.","pares":[["Admisión","Entra la mezcla de aire y combustible al cilindro"],["Compresión","El pistón sube y comprime con las válvulas cerradas"],["Expansión","Salta la chispa, la mezcla explota y empuja el pistón"],["Escape","El pistón sube y expulsa los gases quemados"]],"cita":"TIEMPO 1 · Admisión — Se abre la válvula de admisión y entra la mezcla de aire y combustible al cilindro. Pistón baja · admisión abierta · TIEMPO 2 · Compresión — Ambas válvulas cerradas. El pistón sube y comprime la mezcla, que se calienta y queda lista para encender. Pistón sube · válvulas cerradas · TIEMPO 3 · Expansión — Salta la chispa (o se inyecta el diésel), la mezcla explota y empuja el pistón. Es el único tiempo que produce fuerza. Pistón baja · válvulas cerradas · TIEMPO 4 · Escape — Se abre la válvula de escape y el pistón, al subir, expulsa los gases quemados. Pistón sube · escape abierto","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El ciclo de cuatro tiempos","bloques":["lu5.4","lu5.5","lu5.6","lu5.7"]}},{"id":"11-L04-P3","tipo":"opcion","enunciado":"En un motor de cuatro tiempos, ¿cuántas vueltas da el cigüeñal en un ciclo completo?","opciones":["Dos vueltas","Una vuelta","Cuatro vueltas","Media vuelta"],"correcta":0,"cita":"Cuatro carreras del pistón, dos vueltas completas del cigüeñal.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El ciclo de cuatro tiempos","bloque":"lu5.3"}},{"id":"11-L04-P4","tipo":"vf","enunciado":"Gracias a la película de aceite nada toca metal con metal, y en la explosión el aceite además se lleva el calor.","correcta":true,"cita":"Nada toca metal con metal gracias a la película de aceite. Y en la explosión el aceite además se lleva el calor.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El ciclo de cuatro tiempos","bloque":"lu5.8"}}]},{"id":"11-L05","titulo":"El cárter y el recorrido del aceite","palabras":285,"minutos":3,"fuentes":[{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor"},{"vista":"v-glosario","sub":"gl","texto":"Glosario › Glosario"}],"cuerpo":[{"id":"lu5.9","t":"h3","f":"El cárter: dónde vive el aceite","h3":"El cárter: dónde vive el aceite"},{"id":"lu5.10","t":"p","f":"El cárter es el depósito metálico en la parte baja del motor. Ahí se almacena todo el aceite cuando el motor está apagado, y ahí vuelve a caer por gravedad después de recorrer el motor.","h3":"El cárter: dónde vive el aceite","cls":"what"},{"id":"lu5.11","t":"nota","f":"Cada motor tiene su capacidad, y **eso define cuánto aceite vendes en cada cambio**: auto liviano 3 a 5 litros, camioneta o SUV 5 a 7, moto 0,8 a 1,5, camión o bus 15 a 40. Por eso el diésel se vende en balde y el liviano en galón.","lbl":"La capacidad del cárter es tu unidad de venta","k":"key","h3":"El cárter: dónde vive el aceite"},{"id":"lu5.12","t":"nota","f":"**Sobrellenar es tan dañino como dejarlo corto:** el cigüeñal bate el aceite y la espuma no lubrica.","lbl":"La capacidad del cárter es tu unidad de venta","k":"key","h3":"El cárter: dónde vive el aceite"},{"id":"lu5.13","t":"h3","f":"El recorrido del aceite","h3":"El recorrido del aceite"},{"id":"lu5.14","t":"li","f":"**Cárter.** El aceite descansa en el fondo del motor.","h3":"El recorrido del aceite"},{"id":"lu5.15","t":"li","f":"**Bomba de aceite.** Lo succiona y lo manda a presión al resto del circuito.","h3":"El recorrido del aceite"},{"id":"lu5.16","t":"li","f":"**Filtro de aceite.** Retiene partículas de desgaste y suciedad.","h3":"El recorrido del aceite"},{"id":"lu5.17","t":"li","f":"**Regulador de presión.** Mantiene la presión estable en todo el sistema.","h3":"El recorrido del aceite"},{"id":"lu5.18","t":"li","f":"**Galerías.** Conductos perforados dentro del bloque que llevan el aceite hasta cada pieza móvil.","h3":"El recorrido del aceite"},{"id":"lu5.19","t":"li","f":"**Piezas móviles.** Cigüeñal, bielas, pistones, árbol de levas, turbo si lo hay.","h3":"El recorrido del aceite"},{"id":"lu5.20","t":"li","f":"**Enfriador de aceite.** En motores que lo llevan, le baja la temperatura.","h3":"El recorrido del aceite"},{"id":"lu5.21","t":"li","f":"**Vuelta al cárter.** Cae por gravedad y empieza otra vez.","h3":"El recorrido del aceite"},{"id":"lu5.22","t":"nota","f":"Con el motor apagado el aceite está abajo. Al arrancar, la bomba tarda un instante en subirlo, y en ese instante hay piezas girando con poca película. **Ahí ocurre la mayor parte del desgaste.** Eso resuelve el número antes de la W.","lbl":"Por qué importa el arranque en frío","k":"err","h3":"El recorrido del aceite"},{"id":"gl.8","t":"def","f":"**Galerías:** Los conductos perforados dentro del bloque por donde circula el aceite a presión."}],"preguntas":[{"id":"11-L05-P1","tipo":"opcion","enunciado":"¿Qué es el cárter?","opciones":["El depósito metálico en la parte baja del motor donde se almacena el aceite","La bomba que manda el aceite a presión","El filtro que retiene la suciedad","El conducto que lleva el aceite al turbo"],"correcta":0,"cita":"El cárter es el depósito metálico en la parte baja del motor.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El cárter: dónde vive el aceite","bloque":"lu5.10"}},{"id":"11-L05-P2","tipo":"emparejar","enunciado":"Empareja cada vehículo con la capacidad típica de su cárter.","pares":[["Auto liviano","3 a 5 litros"],["Camioneta o SUV","5 a 7 litros"],["Moto","0,8 a 1,5 litros"],["Camión o bus","15 a 40 litros"]],"cita":"auto liviano 3 a 5 litros, camioneta o SUV 5 a 7, moto 0,8 a 1,5, camión o bus 15 a 40","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El cárter: dónde vive el aceite","bloque":"lu5.11"}},{"id":"11-L05-P3","tipo":"vf","enunciado":"Llenar el cárter por encima de su nivel le da más protección al motor.","correcta":false,"cita":"Sobrellenar es tan dañino como dejarlo corto: el cigüeñal bate el aceite y la espuma no lubrica.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El cárter: dónde vive el aceite","bloque":"lu5.12"}},{"id":"11-L05-P4","tipo":"opcion","enunciado":"¿Cuándo ocurre la mayor parte del desgaste del motor?","opciones":["Al arrancar en frío, antes de que la bomba suba el aceite","En carretera, a velocidad constante","Con el motor apagado","Al cambiar el aceite"],"correcta":0,"cita":"Al arrancar, la bomba tarda un instante en subirlo, y en ese instante hay piezas girando con poca película. Ahí ocurre la mayor parte del desgaste.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El recorrido del aceite","bloque":"lu5.22"}},{"id":"11-L05-P5","tipo":"opcion","enunciado":"En el recorrido del aceite, ¿qué hace la bomba?","opciones":["Lo succiona y lo manda a presión al resto del circuito","Retiene las partículas de desgaste","Le baja la temperatura","Lo deja caer por gravedad al cárter"],"correcta":0,"cita":"Lo succiona y lo manda a presión al resto del circuito.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El recorrido del aceite","bloque":"lu5.15"}}]},{"id":"11-L06","titulo":"El motor de dos tiempos","palabras":292,"minutos":3,"fuentes":[{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor"},{"vista":"v-motos","sub":"mo4","texto":"Motos › 2T y 4T"},{"qa":"premezcla proporcion dosificacion 1:50 1:32 autolube mezcla gasolina","texto":"Banco de respuestas del manual"}],"cuerpo":[{"id":"lu5.23","t":"h3","f":"El ciclo de dos tiempos","h3":"El ciclo de dos tiempos"},{"id":"lu5.24","t":"p","f":"El mismo trabajo en la mitad de carreras: una sola vuelta de cigüeñal. Hay explosión en cada vuelta, lo que da más potencia por cilindrada con un motor más simple y liviano.","h3":"El ciclo de dos tiempos","cls":"what"},{"id":"lu5.25","t":"fila","f":"**Carreras** — Cuatro · dos vueltas de cigüeñal — Dos · una vuelta","cols":["","4 tiempos","2 tiempos"],"cells":["**Carreras**","Cuatro · dos vueltas de cigüeñal","Dos · una vuelta"],"h3":"El ciclo de dos tiempos"},{"id":"lu5.26","t":"fila","f":"**Dónde vive el aceite** — En el cárter. Circula, se filtra y se cambia. — Mezclado con la gasolina, en premezcla o por bomba.","cols":["","4 tiempos","2 tiempos"],"cells":["**Dónde vive el aceite**","En el cárter. Circula, se filtra y se cambia.","Mezclado con la gasolina, en premezcla o por bomba."],"h3":"El ciclo de dos tiempos"},{"id":"lu5.27","t":"fila","f":"**Consumo de aceite** — Si consume, hay problema mecánico. — Consume siempre. Se quema con el combustible: es normal.","cols":["","4 tiempos","2 tiempos"],"cells":["**Consumo de aceite**","Si consume, hay problema mecánico.","Consume siempre. Se quema con el combustible: es normal."],"h3":"El ciclo de dos tiempos"},{"id":"lu5.28","t":"fila","f":"**Cárter y filtro** — Los dos. — Ninguno de los dos.","cols":["","4 tiempos","2 tiempos"],"cells":["**Cárter y filtro**","Los dos.","Ninguno de los dos."],"h3":"El ciclo de dos tiempos"},{"id":"lu5.29","t":"fila","f":"**Dónde se ve** — Autos, camiones, buses, motos modernas. — Motos antiguas, desbrozadoras, motosierras, fumigadoras, fuera de borda.","cols":["","4 tiempos","2 tiempos"],"cells":["**Dónde se ve**","Autos, camiones, buses, motos modernas.","Motos antiguas, desbrozadoras, motosierras, fumigadoras, fuera de borda."],"h3":"El ciclo de dos tiempos"},{"id":"lu5.30","t":"fila","f":"**Norma** — JASO MA / MA2 (moto) API SQ / SP (auto) — JASO FC / FD","cols":["","4 tiempos","2 tiempos"],"cells":["**Norma**","JASO MA / MA2 (moto) API SQ / SP (auto)","JASO FC / FD"],"h3":"El ciclo de dos tiempos"},{"id":"lu5.31","t":"nota","f":"El 2T es un **consumible**: se acaba con cada tanque y el cliente vuelve en días. El 4T es **venta por intervalo**. El 2T se gana con disponibilidad; el 4T, con argumento técnico.","lbl":"La consecuencia comercial","k":"key","h3":"El ciclo de dos tiempos"},{"id":"mo4.4","t":"nota","f":"Aquí está la diferencia: **un dos tiempos no tiene cárter de aceite.** El aceite va mezclado con la gasolina — en premezcla o inyectado —, lubrica de paso y **se quema con la mezcla**.","lbl":"Por qué el aceite se quema","k":"key","h3":"Cómo trabaja un motor de dos tiempos"},{"id":"mo4.5","t":"nota","f":"Por eso un 2T consume aceite siempre. **No es una falla: es su forma normal de funcionar.** Y por eso tampoco lleva filtro de aceite, ni se cambia el aceite: se repone con cada tanque.","lbl":"Por qué el aceite se quema","k":"key","h3":"Cómo trabaja un motor de dos tiempos"},{"t":"qa","f":"En premezcla el aceite 2T se echa en el tanque con la gasolina, en proporciones de 1:50 a 1:32 según el equipo. En inyección (autolube) hay un depósito aparte y una bomba que dosifica sola. La proporción la da el fabricante: más aceite no es más protección, es más humo y más carbón.","qa":"premezcla proporcion dosificacion 1:50 1:32 autolube mezcla gasolina"}],"preguntas":[{"id":"11-L06-P1","tipo":"vf","enunciado":"Que un motor de dos tiempos consuma aceite es normal: se quema con el combustible.","correcta":true,"cita":"Consume siempre. Se quema con el combustible: es normal.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El ciclo de dos tiempos","bloque":"lu5.27"}},{"id":"11-L06-P2","tipo":"opcion","enunciado":"¿Dónde va el aceite en un motor de dos tiempos?","opciones":["Mezclado con la gasolina, en premezcla o por bomba","En el cárter, con su filtro","En un depósito que nunca se repone","En la caja de cambios"],"correcta":0,"cita":"Mezclado con la gasolina, en premezcla o por bomba.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El ciclo de dos tiempos","bloque":"lu5.26"}},{"id":"11-L06-P3","tipo":"opcion","enunciado":"Un cliente quiere echar más aceite 2T del que pide el fabricante «para proteger más». ¿Qué le dices?","opciones":["Que más aceite no es más protección: es más humo y más carbón","Que está bien: mientras más aceite, mejor","Que use aceite de carro","Que la proporción no importa"],"correcta":0,"cita":"más aceite no es más protección, es más humo y más carbón","fuente":{"qa":"premezcla proporcion dosificacion 1:50 1:32 autolube mezcla gasolina","texto":"Banco de respuestas del manual"}},{"id":"11-L06-P4","tipo":"emparejar","enunciado":"Empareja cada dato con su motor.","pares":[["Carreras del 4T","Cuatro · dos vueltas de cigüeñal"],["Carreras del 2T","Dos · una vuelta"],["Cárter y filtro del 4T","Los dos"],["Cárter y filtro del 2T","Ninguno de los dos"]],"cita":"Carreras — Cuatro · dos vueltas de cigüeñal — Dos · una vuelta · Cárter y filtro — Los dos. — Ninguno de los dos.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El ciclo de dos tiempos","bloques":["lu5.25","lu5.28"]}},{"id":"11-L06-P5","tipo":"opcion","enunciado":"¿Cómo se gana la venta de aceite 2T?","opciones":["Con disponibilidad: es un consumible y el cliente vuelve en días","Con argumento técnico sobre el intervalo","Con descuentos por tanque","Vendiéndolo junto con el filtro de aceite"],"correcta":0,"cita":"El 2T se gana con disponibilidad; el 4T, con argumento técnico.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El ciclo de dos tiempos","bloque":"lu5.31"}}]}]}]},{"id":"11-N2","titulo":"Leer el envase","modulos":[{"id":"11-M04","titulo":"Viscosidad y SAE","lecciones":[{"id":"11-L07","titulo":"Qué dice un 20W-50","palabras":252,"minutos":3,"fuentes":[{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas"},{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad"},{"vista":"v-glosario","sub":"gl","texto":"Glosario › Glosario"}],"cuerpo":[{"id":"lu3.2","t":"p","f":"La Sociedad de Ingenieros Automotrices, de EE. UU. Mide la viscosidad: qué tan fluido o espeso es el aceite. Su norma J300 define 0W, 5W, 10W… y los grados 20, 30, 40, 50. **No dice nada sobre la calidad**, solo sobre el espesor.","h4":"SAE · Society of Automotive Engineers","cls":"ask"},{"id":"lu4.1","t":"p","f":"Multigrado quiere decir que un solo aceite cumple dos grados: uno en frío y otro caliente.","cls":"lead"},{"id":"lu4.2","t":"dato","f":"20W-50","cls":"grade"},{"id":"lu4.3","t":"dato","f":"**20W · en frío** Cómo se comporta al arrancar. La W es de Winter, invierno — no de peso. Cuanto más bajo el número, mejor fluye en frío y más rápido llega el aceite arriba en los primeros segundos, que es cuando ocurre la mayor parte del desgaste."},{"id":"lu4.4","t":"dato","f":"**50 · caliente** Cómo se comporta a 100 °C, en temperatura de trabajo. Cuanto más alto el número, más gruesa la película entre las piezas. Sirve en motores con holguras grandes por kilometraje, carga pesada o calor sostenido."},{"id":"lu4.5","t":"nota","f":"No son 20 grados de temperatura. Es una posición en la escala **SAE J300**: 0W, 5W, 10W, 15W, 20W, 25W de menor a mayor espesor en frío. Es el malentendido más repetido del mostrador.","lbl":"Lo que el 20W NO significa","k":"err"},{"id":"lu4.6","t":"nota","f":"La viscosidad **la manda el fabricante del motor**, no el clima, no el precio y no la costumbre del taller. Más espeso no es más protección.","lbl":"La regla de oro","k":"key"},{"id":"gl.4","t":"def","f":"**Multigrado:** Aceite que cumple dos grados SAE, uno en frío y otro caliente. Todo lo que lleva \"W\" en el nombre."},{"id":"gl.6","t":"def","f":"**Índice de viscosidad:** Qué tanto cambia la viscosidad con la temperatura. Cuanto más alto, más estable el aceite."}],"preguntas":[{"id":"11-L07-P1","tipo":"opcion","enunciado":"En un 20W-50, ¿qué quiere decir la W?","opciones":["Winter, invierno: es el grado en frío","Weight, el peso del aceite","Los watts de potencia","Los grados de temperatura"],"correcta":0,"cita":"La W es de Winter, invierno — no de peso.","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad","bloque":"lu4.3"}},{"id":"11-L07-P2","tipo":"vf","enunciado":"El 20W de un 20W-50 quiere decir que el aceite trabaja a 20 grados de temperatura.","correcta":false,"cita":"No son 20 grados de temperatura.","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad","bloque":"lu4.5"}},{"id":"11-L07-P3","tipo":"opcion","enunciado":"¿Quién manda la viscosidad que lleva un motor?","opciones":["El fabricante del motor","El clima de la ciudad","La costumbre del taller","El precio del galón"],"correcta":0,"cita":"La viscosidad la manda el fabricante del motor, no el clima, no el precio y no la costumbre del taller.","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad","bloque":"lu4.6"}},{"id":"11-L07-P4","tipo":"opcion","enunciado":"¿Qué mide la SAE?","opciones":["La viscosidad: qué tan fluido o espeso es el aceite","La calidad y el desempeño del aceite","El ahorro de combustible","La fricción del embrague"],"correcta":0,"cita":"Mide la viscosidad: qué tan fluido o espeso es el aceite.","fuente":{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas","bloque":"lu3.2"}},{"id":"11-L07-P5","tipo":"emparejar","enunciado":"Empareja cada término con lo que significa.","pares":[["Multigrado","Cumple dos grados SAE: uno en frío y otro caliente"],["El 50 de un 20W-50","Cómo se comporta a 100 °C, en temperatura de trabajo"],["Índice de viscosidad","Qué tanto cambia la viscosidad con la temperatura"]],"cita":"Multigrado: Aceite que cumple dos grados SAE, uno en frío y otro caliente. Todo lo que lleva \"W\" en el nombre. · 50 · caliente Cómo se comporta a 100 °C, en temperatura de trabajo. Cuanto más alto el número, más gruesa la película entre las piezas. Sirve en motores con holguras grandes por kilometraje, carga pesada o calor sostenido. · Índice de viscosidad: Qué tanto cambia la viscosidad con la temperatura. Cuanto más alto, más estable el aceite.","fuente":{"vista":"v-glosario","sub":"gl","texto":"Glosario › Glosario · Lubricantes › Viscosidad","bloques":["gl.4","lu4.4","gl.6"]}}]},{"id":"11-L08","titulo":"El cuadro de viscosidades","palabras":177,"minutos":2,"fuentes":[{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad"},{"qa":"aceite mas espeso grueso protege mejor mito","texto":"Banco de respuestas del manual"}],"cuerpo":[{"id":"lu4.7","t":"h3","f":"El cuadro completo de viscosidades","h3":"El cuadro completo de viscosidades"},{"id":"lu4.8","t":"fila","f":"**Motor gasolina** — 0W-16 · 5W-20 · 5W-30 · 5W-40 10W-30 · 10W-40 · 20W-50 — SAE J300","cols":["Aplicación","Grados","Escala"],"cells":["**Motor gasolina**","0W-16 · 5W-20 · 5W-30 · 5W-40 10W-30 · 10W-40 · 20W-50","SAE J300"],"h3":"El cuadro completo de viscosidades"},{"id":"lu4.9","t":"fila","f":"**Motor diésel** — 5W-40 · 10W-40 · 15W-40 25W-60 · monogrado 40 y 50 — SAE J300","cols":["Aplicación","Grados","Escala"],"cells":["**Motor diésel**","5W-40 · 10W-40 · 15W-40 25W-60 · monogrado 40 y 50","SAE J300"],"h3":"El cuadro completo de viscosidades"},{"id":"lu4.10","t":"fila","f":"**Moto 4T** — 10W-40 · 15W-50 · 20W-50 · 10W-60 — SAE J300 + JASO","cols":["Aplicación","Grados","Escala"],"cells":["**Moto 4T**","10W-40 · 15W-50 · 20W-50 · 10W-60","SAE J300 + JASO"],"h3":"El cuadro completo de viscosidades"},{"id":"lu4.11","t":"fila","f":"**Transmisión y corona** — 80W-90 · 85W-140 · 75W-80 75W-85 · 75W-90 · 90 · 140 — SAE J306","cols":["Aplicación","Grados","Escala"],"cells":["**Transmisión y corona**","80W-90 · 85W-140 · 75W-80 75W-85 · 75W-90 · 90 · 140","SAE J306"],"h3":"El cuadro completo de viscosidades"},{"id":"lu4.12","t":"fila","f":"**Caja automática** — ATF · Dexron Mercon V, VI y LV · CVT · DCT — Especificación del fabricante","cols":["Aplicación","Grados","Escala"],"cells":["**Caja automática**","ATF · Dexron Mercon V, VI y LV · CVT · DCT","Especificación del fabricante"],"h3":"El cuadro completo de viscosidades"},{"id":"lu4.13","t":"fila","f":"**Hidráulico e industrial** — ISO 32 · 46 · 68 · 100 · 150 · 220 AW = antidesgaste — ISO VG","cols":["Aplicación","Grados","Escala"],"cells":["**Hidráulico e industrial**","ISO 32 · 46 · 68 · 100 · 150 · 220 AW = antidesgaste","ISO VG"],"h3":"El cuadro completo de viscosidades"},{"id":"lu4.14","t":"fila","f":"**Grasas** — NLGI 2 multipropósito NLGI 3 rodamiento y alta temperatura — NLGI","cols":["Aplicación","Grados","Escala"],"cells":["**Grasas**","NLGI 2 multipropósito NLGI 3 rodamiento y alta temperatura","NLGI"],"h3":"El cuadro completo de viscosidades"},{"id":"lu4.15","t":"nota","f":"Un **80W-90 de transmisión no es más espeso que un 20W-50 de motor**, aunque el número sea mayor: son escalas distintas (J306 contra J300). En la práctica, un 80W-90 equivale a un 20W-50.","lbl":"El error que hay que evitar de entrada","k":"err","h3":"El cuadro completo de viscosidades"},{"t":"qa","f":"No. Más espeso no es más protección. Un aceite más grueso del que pide el motor tarda más en llegar a las galerías al arrancar, y el arranque en frío es donde ocurre la mayor parte del desgaste. Además consume más combustible. La viscosidad la manda el manual.","qa":"aceite mas espeso grueso protege mejor mito"}],"preguntas":[{"id":"11-L08-P1","tipo":"vf","enunciado":"Un 80W-90 de transmisión es más espeso que un 20W-50 de motor porque su número es mayor.","correcta":false,"cita":"Un 80W-90 de transmisión no es más espeso que un 20W-50 de motor, aunque el número sea mayor: son escalas distintas (J306 contra J300).","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › El cuadro completo de viscosidades","bloque":"lu4.15"}},{"id":"11-L08-P2","tipo":"emparejar","enunciado":"Empareja cada aplicación con su escala.","pares":[["Motor gasolina","SAE J300"],["Transmisión y corona","SAE J306"],["Hidráulico e industrial","ISO VG"],["Grasas","NLGI"]],"cita":"Motor gasolina — 0W-16 · 5W-20 · 5W-30 · 5W-40 10W-30 · 10W-40 · 20W-50 — SAE J300 · Transmisión y corona — 80W-90 · 85W-140 · 75W-80 75W-85 · 75W-90 · 90 · 140 — SAE J306 · Hidráulico e industrial — ISO 32 · 46 · 68 · 100 · 150 · 220 AW = antidesgaste — ISO VG · Grasas — NLGI 2 multipropósito NLGI 3 rodamiento y alta temperatura — NLGI","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › El cuadro completo de viscosidades","bloques":["lu4.8","lu4.11","lu4.13","lu4.14"]}},{"id":"11-L08-P3","tipo":"vf","enunciado":"Un aceite más espeso que el que pide el motor lo protege más.","correcta":false,"cita":"Más espeso no es más protección.","fuente":{"qa":"aceite mas espeso grueso protege mejor mito","texto":"Banco de respuestas del manual"}},{"id":"11-L08-P4","tipo":"opcion","enunciado":"¿Cuál de estos grados es de motor diésel según el cuadro?","opciones":["15W-40","0W-16","80W-90","ISO 32"],"correcta":0,"cita":"5W-40 · 10W-40 · 15W-40","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › El cuadro completo de viscosidades","bloque":"lu4.9"}},{"id":"11-L08-P5","tipo":"opcion","enunciado":"En un aceite hidráulico, ¿qué quiere decir AW?","opciones":["Antidesgaste","Para invierno","Alta viscosidad","Apto para agua"],"correcta":0,"cita":"AW = antidesgaste","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › El cuadro completo de viscosidades","bloque":"lu4.13"}}]}]},{"id":"11-M05","titulo":"Normas API, ILSAC y JASO","lecciones":[{"id":"11-L09","titulo":"API, ILSAC y las otras siglas","palabras":264,"minutos":3,"fuentes":[{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas"},{"qa":"diferencia api sae","texto":"Banco de respuestas del manual"}],"cuerpo":[{"id":"lu3.1","t":"p","f":"Cada sigla es una institución distinta midiendo una cosa distinta. Una vez que sabes quién es quién, el envase se lee solo.","cls":"lead"},{"id":"lu3.3","t":"p","f":"El Instituto Americano del Petróleo. Mide el desempeño: qué tan bien protege. Usa dos letras — **S** para gasolina, **C** para diésel — y la segunda avanza con el alfabeto según salen normas más exigentes. También clasifica las bases en grupos I a V.","h4":"API · American Petroleum Institute","cls":"ask"},{"id":"lu3.4","t":"p","f":"Comité de fabricantes de EE. UU. y Japón. Mide el ahorro de combustible además de la protección. Categorías GF-5, GF-6A/6B y hoy GF-7A/7B. Es el sello \"starburst\".","h4":"ILSAC","cls":"ask"},{"id":"lu3.6","t":"p","f":"Asociación de constructores europeos de automóviles. Mide según la exigencia europea: secuencias A/B para liviano, C para vehículos con filtro de partículas, E para pesado.","h4":"ACEA","cls":"ask"},{"id":"lu3.8","t":"p","f":"Organización Internacional de Normalización. Mide la viscosidad de aceites industriales e hidráulicos: 32, 46, 68, 100, 150, 220. Un ISO 68 no tiene nada que ver con un SAE 68.","h4":"ISO VG","cls":"ask"},{"id":"lu3.10","t":"nota","f":"En un envase hay siempre **dos datos**: la viscosidad SAE y la norma API. **La viscosidad la manda el fabricante del motor; la norma se elige igual o superior a la del manual.** Con eso respondes casi cualquier consulta.","lbl":"La regla que resuelve el 90 % de las preguntas","k":"key"},{"t":"qa","f":"SAE mide la viscosidad (qué tan espeso es el aceite) y API mide el desempeño (qué tan bien protege). Son dos cosas independientes: un 20W-50 puede ser API SF viejo o API SP moderno. En el envase siempre van los dos datos. Regla práctica: la viscosidad la manda el fabricante del motor, y la norma API se elige igual o superior a la que pide el manual.","qa":"diferencia api sae"}],"preguntas":[{"id":"11-L09-P1","tipo":"opcion","enunciado":"¿Qué mide la API?","opciones":["El desempeño: qué tan bien protege","La viscosidad","La consistencia de las grasas","El punto de ebullición"],"correcta":0,"cita":"Mide el desempeño: qué tan bien protege.","fuente":{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas","bloque":"lu3.3"}},{"id":"11-L09-P2","tipo":"emparejar","enunciado":"Empareja cada sigla con lo que mide.","pares":[["SAE","La viscosidad"],["API","El desempeño: qué tan bien protege"],["ILSAC","El ahorro de combustible además de la protección"],["ISO VG","La viscosidad de aceites industriales e hidráulicos"]],"cita":"La Sociedad de Ingenieros Automotrices, de EE. UU. Mide la viscosidad: qué tan fluido o espeso es el aceite. Su norma J300 define 0W, 5W, 10W… y los grados 20, 30, 40, 50. No dice nada sobre la calidad, solo sobre el espesor. · El Instituto Americano del Petróleo. Mide el desempeño: qué tan bien protege. Usa dos letras — S para gasolina, C para diésel — y la segunda avanza con el alfabeto según salen normas más exigentes. También clasifica las bases en grupos I a V. · Comité de fabricantes de EE. UU. y Japón. Mide el ahorro de combustible además de la protección. Categorías GF-5, GF-6A/6B y hoy GF-7A/7B. Es el sello \"starburst\". · Organización Internacional de Normalización. Mide la viscosidad de aceites industriales e hidráulicos: 32, 46, 68, 100, 150, 220. Un ISO 68 no tiene nada que ver con un SAE 68.","fuente":{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas","bloques":["lu3.2","lu3.3","lu3.4","lu3.8"]}},{"id":"11-L09-P3","tipo":"opcion","enunciado":"En la norma API, ¿qué indican las letras S y C?","opciones":["S para gasolina y C para diésel","S para sintético y C para convencional","S para moto y C para carro","S para verano y C para invierno"],"correcta":0,"cita":"S para gasolina, C para diésel","fuente":{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas","bloque":"lu3.3"}},{"id":"11-L09-P4","tipo":"vf","enunciado":"La norma API se elige igual o superior a la que pide el manual del vehículo.","correcta":true,"cita":"la norma se elige igual o superior a la del manual","fuente":{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas","bloque":"lu3.10"}},{"id":"11-L09-P5","tipo":"opcion","enunciado":"¿Cuál es el sello «starburst» del envase?","opciones":["ILSAC","API","JASO","ACEA"],"correcta":0,"cita":"Es el sello \"starburst\".","fuente":{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas","bloque":"lu3.4"}}]},{"id":"11-L10","titulo":"La escalera de las normas","palabras":160,"minutos":2,"fuentes":[{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas"},{"qa":"api sp sq sn plus categoria gasolina vigente lspi","texto":"Banco de respuestas del manual"}],"cuerpo":[{"id":"lu3.11","t":"h3","f":"La escalera de las normas","h3":"La escalera de las normas"},{"id":"lu3.12","t":"fila","f":"**Gasolina** — SF → SL → SM → SN → SN Plus → SP → SQ SQ desde marzo 2025","cols":["Familia","De más antiguo a más nuevo"],"cells":["**Gasolina**","SF → SL → SM → SN → SN Plus → SP → SQ SQ desde marzo 2025"],"h3":"La escalera de las normas"},{"id":"lu3.13","t":"fila","f":"**Diésel** — CF → CF-4 → CH-4 → CI-4 → CJ-4 → CK-4 FA-4 es aparte","cols":["Familia","De más antiguo a más nuevo"],"cells":["**Diésel**","CF → CF-4 → CH-4 → CI-4 → CJ-4 → CK-4 FA-4 es aparte"],"h3":"La escalera de las normas"},{"id":"lu3.14","t":"fila","f":"**ILSAC** — GF-5 → GF-6A/6B → GF-7A/7B","cols":["Familia","De más antiguo a más nuevo"],"cells":["**ILSAC**","GF-5 → GF-6A/6B → GF-7A/7B"],"h3":"La escalera de las normas"},{"id":"lu3.15","t":"fila","f":"**Moto 2T** — FB → FC → FD","cols":["Familia","De más antiguo a más nuevo"],"cells":["**Moto 2T**","FB → FC → FD"],"h3":"La escalera de las normas"},{"id":"lu3.16","t":"nota","f":"**CK-4 y FA-4 no son intercambiables.** CK-4 reemplaza a CJ-4 y CI-4 en cualquier diésel. FA-4 es de menor viscosidad y solo para motores modernos que lo especifican.","lbl":"Dos avisos","k":"err","h3":"La escalera de las normas"},{"id":"lu3.17","t":"nota","f":"**Retrocompatible no es universal.** API SQ sirve donde se pedía una categoría anterior, pero **no reemplaza una aprobación de fabricante** ni cambia la viscosidad que exige el motor.","lbl":"Dos avisos","k":"err","h3":"La escalera de las normas"},{"t":"qa","f":"API SP es la categoría de servicio para motores a gasolina vigente desde 2020, y API SQ es la más nueva, de marzo de 2025. Ambas protegen contra LSPI, la detonación anticipada que rompe pistones en los turbo pequeños. La escalera histórica es SF, SL, SM, SN, SN Plus, SP, SQ: siempre se elige igual o superior a la del manual.","qa":"api sp sq sn plus categoria gasolina vigente lspi"}],"preguntas":[{"id":"11-L10-P1","tipo":"opcion","enunciado":"En gasolina, ¿cuál es la categoría API más nueva?","opciones":["SQ","SN","SL","SF"],"correcta":0,"cita":"SQ desde marzo 2025","fuente":{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas › La escalera de las normas","bloque":"lu3.12"}},{"id":"11-L10-P2","tipo":"vf","enunciado":"CK-4 y FA-4 son intercambiables en cualquier diésel.","correcta":false,"cita":"CK-4 y FA-4 no son intercambiables.","fuente":{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas › La escalera de las normas","bloque":"lu3.16"}},{"id":"11-L10-P3","tipo":"opcion","enunciado":"¿Contra qué protegen API SP y SQ en los turbo pequeños?","opciones":["Contra el LSPI, la detonación anticipada que rompe pistones","Contra el agua en el combustible","Contra el patinaje del embrague","Contra la congelación"],"correcta":0,"cita":"Ambas protegen contra LSPI, la detonación anticipada que rompe pistones en los turbo pequeños.","fuente":{"qa":"api sp sq sn plus categoria gasolina vigente lspi","texto":"Banco de respuestas del manual"}},{"id":"11-L10-P4","tipo":"vf","enunciado":"Un aceite API SQ puede cambiar la viscosidad que exige el motor.","correcta":false,"cita":"no reemplaza una aprobación de fabricante ni cambia la viscosidad que exige el motor","fuente":{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas › La escalera de las normas","bloque":"lu3.17"}},{"id":"11-L10-P5","tipo":"opcion","enunciado":"¿Qué categoría diésel reemplaza a CJ-4 y CI-4 en cualquier diésel?","opciones":["CK-4","FA-4","CF","SN Plus"],"correcta":0,"cita":"CK-4 reemplaza a CJ-4 y CI-4 en cualquier diésel.","fuente":{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas › La escalera de las normas","bloque":"lu3.16"}}]},{"id":"11-L11","titulo":"JASO: la norma de la moto","palabras":216,"minutos":2,"fuentes":[{"vista":"v-motos","sub":"mo5","texto":"Motos › La norma JASO"}],"cuerpo":[{"id":"mo5.1","t":"p","f":"En auto la norma que manda es API. **En moto es JASO.** Es la diferencia de fondo entre los dos mundos.","cls":"lead"},{"id":"mo5.2","t":"nota","f":"**JASO** es la organización japonesa de estándares automotrices. La crearon los fabricantes japoneses de motos porque las normas de automóvil **no contemplaban el problema propio de una moto**: que motor, caja y embrague comparten el mismo aceite.","lbl":"Qué es y para qué sirve","k":"key"},{"id":"mo5.3","t":"nota","f":"En un auto el embrague es seco y va aparte. En una moto de cambios va **bañado en el aceite del motor**. Por eso JASO no mide la protección del motor — eso lo hace la API — sino el **coeficiente de fricción**: cuánto agarra el embrague.","lbl":"Qué es y para qué sirve","k":"key"},{"id":"mo5.4","t":"h3","f":"Cuatro tiempos · JASO T903","h3":"Cuatro tiempos · JASO T903"},{"id":"mo5.5","t":"fila","f":"**MA** — Húmedo — Moderada — Moto estándar de cambios. El grado general.","cols":["Grado","Embrague","Fricción","Para qué"],"cells":["**MA**","Húmedo","Moderada","Moto estándar de cambios. El grado general."],"h3":"Cuatro tiempos · JASO T903"},{"id":"mo5.6","t":"fila","f":"**MA1** — Húmedo — Baja — Motos antiguas o de conducción suave.","cols":["Grado","Embrague","Fricción","Para qué"],"cells":["**MA1**","Húmedo","Baja","Motos antiguas o de conducción suave."],"h3":"Cuatro tiempos · JASO T903"},{"id":"mo5.7","t":"fila","f":"**MA2** ⭐ — Húmedo — Alta — Más agarre bajo torque y carga. Conducción exigente o deportiva. **Es el que traen las gamas Motul del portafolio.**","cols":["Grado","Embrague","Fricción","Para qué"],"cells":["**MA2** ⭐","Húmedo","Alta","Más agarre bajo torque y carga. Conducción exigente o deportiva. **Es el que traen las gamas Motul del portafolio.**"],"h3":"Cuatro tiempos · JASO T903"},{"id":"mo5.8","t":"fila","f":"**MB** — **Sin** embrague húmedo — Muy baja — Scooter automático con CVT. **Nunca en moto de cambios.**","cols":["Grado","Embrague","Fricción","Para qué"],"cells":["**MB**","**Sin** embrague húmedo","Muy baja","Scooter automático con CVT. **Nunca en moto de cambios.**"],"h3":"Cuatro tiempos · JASO T903"},{"id":"mo5.9","t":"nota","f":"**Moto de cambios → MA, MA1 o MA2. Scooter automático → MB.** Si hay duda, MA2 es la opción segura para casi cualquier moto de cambios. Un MB en embrague húmedo se paga con el embrague patinando.","lbl":"La regla de oro de JASO","k":"err","h3":"Cuatro tiempos · JASO T903"}],"preguntas":[{"id":"11-L11-P1","tipo":"opcion","enunciado":"¿Qué mide la JASO en el aceite de moto de cuatro tiempos?","opciones":["El coeficiente de fricción: cuánto agarra el embrague","La protección del motor","El ahorro de combustible","La viscosidad en frío"],"correcta":0,"cita":"sino el coeficiente de fricción: cuánto agarra el embrague","fuente":{"vista":"v-motos","sub":"mo5","texto":"Motos › La norma JASO","bloque":"mo5.3"}},{"id":"11-L11-P2","tipo":"emparejar","enunciado":"Empareja cada grado JASO con su uso.","pares":[["MA","Moto estándar de cambios"],["MA1","Motos antiguas o de conducción suave"],["MA2","Conducción exigente o deportiva"],["MB","Scooter automático con CVT"]],"cita":"MA — Húmedo — Moderada — Moto estándar de cambios. El grado general. · MA1 — Húmedo — Baja — Motos antiguas o de conducción suave. · MA2 ⭐ — Húmedo — Alta — Más agarre bajo torque y carga. Conducción exigente o deportiva. Es el que traen las gamas Motul del portafolio. · MB — Sin embrague húmedo — Muy baja — Scooter automático con CVT. Nunca en moto de cambios.","fuente":{"vista":"v-motos","sub":"mo5","texto":"Motos › La norma JASO › Cuatro tiempos · JASO T903","bloques":["mo5.5","mo5.6","mo5.7","mo5.8"]}},{"id":"11-L11-P3","tipo":"vf","enunciado":"Un aceite JASO MB en una moto de cambios hace patinar el embrague.","correcta":true,"cita":"Un MB en embrague húmedo se paga con el embrague patinando.","fuente":{"vista":"v-motos","sub":"mo5","texto":"Motos › La norma JASO › Cuatro tiempos · JASO T903","bloque":"mo5.9"}},{"id":"11-L11-P4","tipo":"opcion","enunciado":"Si hay duda con una moto de cambios, ¿qué grado JASO es la opción segura?","opciones":["MA2","MB","FD","MA1"],"correcta":0,"cita":"Si hay duda, MA2 es la opción segura para casi cualquier moto de cambios.","fuente":{"vista":"v-motos","sub":"mo5","texto":"Motos › La norma JASO › Cuatro tiempos · JASO T903","bloque":"mo5.9"}},{"id":"11-L11-P5","tipo":"opcion","enunciado":"¿Por qué en moto manda la JASO y no solo la API?","opciones":["Porque motor, caja y embrague comparten el mismo aceite","Porque las motos no tienen cárter","Porque la API no se usa en Japón","Porque las motos usan aceite de transmisión"],"correcta":0,"cita":"que motor, caja y embrague comparten el mismo aceite","fuente":{"vista":"v-motos","sub":"mo5","texto":"Motos › La norma JASO","bloque":"mo5.2"}}]},{"id":"11-L12","titulo":"Dos tiempos: JASO, API TC e ISO","palabras":244,"minutos":2,"fuentes":[{"vista":"v-motos","sub":"mo5","texto":"Motos › La norma JASO"}],"cuerpo":[{"id":"mo5.10","t":"h3","f":"Dos tiempos","h3":"Dos tiempos"},{"id":"mo5.11","t":"p","f":"Aquí hay tres normas distintas que miden lo mismo, y conviene saber que se corresponden entre sí.","h3":"Dos tiempos","cls":"what"},{"id":"mo5.12","t":"fila","f":"**JASO FB FC · FD** — Japón — Lubricidad, detergencia, humo del escape y obstrucción del sistema de escape. Cada letra es más exigente que la anterior: **FD es la más alta**.","cols":["Norma","De quién","Qué mide"],"cells":["**JASO FB FC · FD**","Japón","Lubricidad, detergencia, humo del escape y obstrucción del sistema de escape. Cada letra es más exigente que la anterior: **FD es la más alta**."],"h3":"Dos tiempos"},{"id":"mo5.13","t":"fila","f":"**API TC** — Estados Unidos — Lubricidad, detergencia, contenido de ceniza y preignición. **Es la única categoría API que existe para dos tiempos.**","cols":["Norma","De quién","Qué mide"],"cells":["**API TC**","Estados Unidos","Lubricidad, detergencia, contenido de ceniza y preignición. **Es la única categoría API que existe para dos tiempos.**"],"h3":"Dos tiempos"},{"id":"mo5.14","t":"fila","f":"**ISO-L-EGB EGC · EGD** — Internacional — Usa **las mismas pruebas y exigencias que JASO**. Es la versión internacional de la misma escala.","cols":["Norma","De quién","Qué mide"],"cells":["**ISO-L-EGB EGC · EGD**","Internacional","Usa **las mismas pruebas y exigencias que JASO**. Es la versión internacional de la misma escala."],"h3":"Dos tiempos"},{"id":"mo5.15","t":"nota","f":"**JASO FB = ISO-L-EGB** · **JASO FC = ISO-L-EGC** · **JASO FD = ISO-L-EGD**","lbl":"JASO e ISO son equivalentes · esta es la tabla que hay que saber","k":"key","h3":"Dos tiempos"},{"id":"mo5.16","t":"nota","f":"Son las mismas pruebas, certificadas por organismos distintos. Si un envase dice ISO-L-EGD y otro JASO FD, **están al mismo nivel**. Lo más alto en dos tiempos es FD / EGD.","lbl":"JASO e ISO son equivalentes · esta es la tabla que hay que saber","k":"key","h3":"Dos tiempos"},{"id":"mo5.17","t":"nota","f":"**TC es una categoría API, no JASO.** Se confunden porque aparecen juntas en el envase, pero son organismos distintos. Un buen aceite de dos tiempos suele traer las dos: API TC y JASO FC o FD.","lbl":"Una precisión sobre el TC","k":"err","h3":"Dos tiempos"},{"id":"mo5.18","t":"nota","f":"En moto, **la API dice qué tan bien protege y la JASO si sirve para ese embrague**. Las dos van en el envase y las dos hay que mirarlas. Con eso y preguntar si es de cambios o automática, resuelves casi todo.","lbl":"Cómo se resume todo en una frase","k":"key","h3":"Dos tiempos"}],"preguntas":[{"id":"11-L12-P1","tipo":"opcion","enunciado":"En dos tiempos, ¿cuál es el nivel JASO más alto?","opciones":["FD","FB","FC","MA2"],"correcta":0,"cita":"FD es la más alta","fuente":{"vista":"v-motos","sub":"mo5","texto":"Motos › La norma JASO › Dos tiempos","bloque":"mo5.12"}},{"id":"11-L12-P2","tipo":"vf","enunciado":"TC es una categoría de la JASO.","correcta":false,"cita":"TC es una categoría API, no JASO.","fuente":{"vista":"v-motos","sub":"mo5","texto":"Motos › La norma JASO › Dos tiempos","bloque":"mo5.17"}},{"id":"11-L12-P3","tipo":"emparejar","enunciado":"Empareja cada norma JASO con su equivalente ISO.","pares":[["JASO FB","ISO-L-EGB"],["JASO FC","ISO-L-EGC"],["JASO FD","ISO-L-EGD"]],"cita":"JASO FB = ISO-L-EGB · JASO FC = ISO-L-EGC · JASO FD = ISO-L-EGD","fuente":{"vista":"v-motos","sub":"mo5","texto":"Motos › La norma JASO › Dos tiempos","bloque":"mo5.15"}},{"id":"11-L12-P4","tipo":"opcion","enunciado":"Un envase dice ISO-L-EGD y otro JASO FD. ¿Qué le dices al cliente?","opciones":["Que están al mismo nivel: son las mismas pruebas","Que el ISO es mejor","Que el JASO es mejor","Que no se pueden comparar"],"correcta":0,"cita":"Si un envase dice ISO-L-EGD y otro JASO FD, están al mismo nivel.","fuente":{"vista":"v-motos","sub":"mo5","texto":"Motos › La norma JASO › Dos tiempos","bloque":"mo5.16"}},{"id":"11-L12-P5","tipo":"opcion","enunciado":"En un envase de moto, ¿qué te dicen la API y la JASO?","opciones":["La API qué tan bien protege y la JASO si sirve para ese embrague","Las dos miden la viscosidad","La API sirve para moto y la JASO para carro","La JASO dice el precio de referencia"],"correcta":0,"cita":"la API dice qué tan bien protege y la JASO si sirve para ese embrague","fuente":{"vista":"v-motos","sub":"mo5","texto":"Motos › La norma JASO › Dos tiempos","bloque":"mo5.18"}}]}]}]},{"id":"11-N3","titulo":"Elegir y cuidar el aceite","modulos":[{"id":"11-M06","titulo":"Tipos e intervalos","lecciones":[{"id":"11-L13","titulo":"Mineral, semisintético y sintético","palabras":213,"minutos":2,"fuentes":[{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad"},{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho"},{"qa":"argumento subir sintetico convencer kilometro protegido escalon","texto":"Banco de respuestas del manual"}],"cuerpo":[{"id":"lu4.16","t":"h3","f":"Mineral, semisintético y sintético","h3":"Mineral, semisintético y sintético"},{"id":"lu4.17","t":"fila","f":"**Mineral** — Base derivada directamente del crudo refinado. — Precio de entrada. Intervalos cortos.","cols":["Tipo","Qué es","Argumento"],"cells":["**Mineral**","Base derivada directamente del crudo refinado.","Precio de entrada. Intervalos cortos."],"h3":"Mineral, semisintético y sintético"},{"id":"lu4.18","t":"fila","f":"**Semisintético** — Mezcla de base mineral con base sintética. — El escalón de subida más fácil de vender.","cols":["Tipo","Qué es","Argumento"],"cells":["**Semisintético**","Mezcla de base mineral con base sintética.","El escalón de subida más fácil de vender."],"h3":"Mineral, semisintético y sintético"},{"id":"lu4.19","t":"fila","f":"**Sintético** — Base fabricada, de moléculas uniformes. Más estable al calor y mejor en frío. — Intervalos largos y menos consumo.","cols":["Tipo","Qué es","Argumento"],"cells":["**Sintético**","Base fabricada, de moléculas uniformes. Más estable al calor y mejor en frío.","Intervalos largos y menos consumo."],"h3":"Mineral, semisintético y sintético"},{"id":"lu4.20","t":"nota","f":"No se vende litro, se vende **kilómetro protegido**. Un sintético de 10.000 km cuesta menos por kilómetro que un mineral de 4.000. El cliente que compara precio de galón compara la métrica equivocada.","lbl":"Cómo se vende el salto a sintético","k":"key","h3":"Mineral, semisintético y sintético"},{"id":"lu2.11","t":"nota","f":"Un \"100 % sintético\" de Grupo III y uno de Grupo IV no son lo mismo. El III sale del petróleo con refinado severo; el IV se fabrica molécula por molécula. Por eso dos sintéticos pueden costar muy distinto y ambos decir la verdad.","lbl":"El detalle que nadie aclara en el mostrador","k":"err","h3":"La base: cinco grupos"},{"t":"qa","f":"No compares galones, compara kilómetros. Un sintético que aguanta 10.000 km cuesta menos por kilómetro que un mineral de 4.000, aunque el envase valga más. Suma el tiempo del vehículo parado en cada cambio y la protección en el arranque en frío, que es donde se desgasta el motor. Y si el cliente no cede, bájalo de escalón dentro de la misma marca: no pierdas la venta.","qa":"argumento subir sintetico convencer kilometro protegido escalon"}],"preguntas":[{"id":"11-L13-P1","tipo":"emparejar","enunciado":"Empareja cada tipo de aceite con lo que es.","pares":[["Mineral","Base derivada directamente del crudo refinado"],["Semisintético","Mezcla de base mineral con base sintética"],["Sintético","Base fabricada, de moléculas uniformes"]],"cita":"Mineral — Base derivada directamente del crudo refinado. — Precio de entrada. Intervalos cortos. · Semisintético — Mezcla de base mineral con base sintética. — El escalón de subida más fácil de vender. · Sintético — Base fabricada, de moléculas uniformes. Más estable al calor y mejor en frío. — Intervalos largos y menos consumo.","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › Mineral, semisintético y sintético","bloques":["lu4.17","lu4.18","lu4.19"]}},{"id":"11-L13-P2","tipo":"opcion","enunciado":"¿Cómo se vende el salto a sintético?","opciones":["Se vende kilómetro protegido, no litro","Por el color del aceite","Con descuento en el galón","Diciendo que no hay que cambiarlo nunca"],"correcta":0,"cita":"No se vende litro, se vende kilómetro protegido.","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › Mineral, semisintético y sintético","bloque":"lu4.20"}},{"id":"11-L13-P3","tipo":"vf","enunciado":"Un sintético de 10.000 km cuesta menos por kilómetro que un mineral de 4.000.","correcta":true,"cita":"Un sintético de 10.000 km cuesta menos por kilómetro que un mineral de 4.000.","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › Mineral, semisintético y sintético","bloque":"lu4.20"}},{"id":"11-L13-P4","tipo":"opcion","enunciado":"¿Cuál es el escalón de subida más fácil de vender?","opciones":["El semisintético","El monogrado 40","El aceite de competición","El aceite de transmisión"],"correcta":0,"cita":"El escalón de subida más fácil de vender.","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › Mineral, semisintético y sintético","bloque":"lu4.18"}},{"id":"11-L13-P5","tipo":"opcion","enunciado":"Si el cliente no cede con el sintético, ¿qué haces?","opciones":["Lo bajas de escalón dentro de la misma marca: no pierdes la venta","Le dices que vuelva otro día","Le ofreces aceite de transmisión","Le vendes el más barato aunque no cumpla el manual"],"correcta":0,"cita":"Y si el cliente no cede, bájalo de escalón dentro de la misma marca: no pierdas la venta.","fuente":{"qa":"argumento subir sintetico convencer kilometro protegido escalon","texto":"Banco de respuestas del manual"}}]},{"id":"11-L14","titulo":"Cada cuánto se cambia","palabras":248,"minutos":2,"fuentes":[{"qa":"cada cuanto cambia aceite intervalo kilometraje km","texto":"Banco de respuestas del manual"},{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho"},{"qa":"aceite taxi uso severo ciudad","texto":"Banco de respuestas del manual"},{"qa":"long life larga vida intervalo extendido","texto":"Banco de respuestas del manual"},{"vista":"v-lubricantes","sub":"lu6","texto":"Lubricantes › Si no se cambia"}],"cuerpo":[{"t":"qa","f":"Depende de la base. Mineral: 3.000 a 5.000 km. Semisintético: 5.000 a 7.500. Sintético: 7.500 a 10.000 o más. Esos son rangos de referencia — el que manda es el manual del vehículo. Y en uso severo (taxi, ciudad, polvo, taxi de altura, remolque) se acorta. En turbo el intervalo no se estira nunca.","qa":"cada cuanto cambia aceite intervalo kilometraje km"},{"id":"lu2.22","t":"nota","f":"El aceite no se \"gasta\" como la gasolina: **lo que se agota es el paquete de aditivos**. Los detergentes se consumen, los dispersantes se saturan de hollín, los antioxidantes se acaban. Queda base sin propiedades. Por eso hay intervalo de cambio.","lbl":"Por qué esto vende","k":"key","h3":"Los aditivos: qué hace cada uno"},{"t":"qa","f":"Un taxi es uso severo puro: motor caliente todo el día, mucho ralentí, arranques y paradas constantes. Ahí el intervalo se acorta respecto al del manual, y el sintético se justifica solo porque aguanta la temperatura y estira el intervalo. Es el cliente ideal para subir de escalón.","qa":"aceite taxi uso severo ciudad"},{"t":"qa","f":"Long Life es un aceite formulado para intervalos extendidos, normalmente sintético y con una aprobación de fabricante detrás (VW 504/507, MB 229.5, BMW LL-04). El intervalo largo solo vale si el vehículo lo permite y el uso no es severo: en taxi o en ciudad con mucho ralentí, el intervalo se acorta igual.","qa":"long life larga vida intervalo extendido"},{"id":"lu6.10","t":"nota","f":"\"El aceite no se acaba, se gasta por dentro. Aunque el nivel esté bien, si pasó el intervalo ya no protege.\" Esa frase convierte el \"todavía tiene nivel\" en una venta, y es literalmente cierta.","lbl":"Cómo se dice en el mostrador","k":"key"}],"preguntas":[{"id":"11-L14-P1","tipo":"emparejar","enunciado":"Empareja cada base con su intervalo de referencia.","pares":[["Mineral","3.000 a 5.000 km"],["Semisintético","5.000 a 7.500 km"],["Sintético","7.500 a 10.000 km o más"]],"cita":"Mineral: 3.000 a 5.000 km. Semisintético: 5.000 a 7.500. Sintético: 7.500 a 10.000 o más.","fuente":{"qa":"cada cuanto cambia aceite intervalo kilometraje km","texto":"Banco de respuestas del manual"}},{"id":"11-L14-P2","tipo":"opcion","enunciado":"¿Quién manda el intervalo de cambio?","opciones":["El manual del vehículo","El color del aceite","Lo que diga el cliente","La marca del filtro"],"correcta":0,"cita":"el que manda es el manual del vehículo","fuente":{"qa":"cada cuanto cambia aceite intervalo kilometraje km","texto":"Banco de respuestas del manual"}},{"id":"11-L14-P3","tipo":"vf","enunciado":"En uso severo, como un taxi, el intervalo se acorta respecto al del manual.","correcta":true,"cita":"Ahí el intervalo se acorta respecto al del manual","fuente":{"qa":"aceite taxi uso severo ciudad","texto":"Banco de respuestas del manual"}},{"id":"11-L14-P4","tipo":"vf","enunciado":"En un motor turbo se puede estirar el intervalo si el aceite es bueno.","correcta":false,"cita":"En turbo el intervalo no se estira nunca.","fuente":{"qa":"cada cuanto cambia aceite intervalo kilometraje km","texto":"Banco de respuestas del manual"}},{"id":"11-L14-P5","tipo":"opcion","enunciado":"El cliente dice que su aceite «todavía tiene nivel». ¿Qué le respondes?","opciones":["El aceite no se acaba, se gasta por dentro: si pasó el intervalo, ya no protege","Que tiene razón: si hay nivel, no hace falta cambiarlo","Que complete con cualquier aceite","Que cambie solo el filtro"],"correcta":0,"cita":"El aceite no se acaba, se gasta por dentro. Aunque el nivel esté bien, si pasó el intervalo ya no protege.","fuente":{"vista":"v-lubricantes","sub":"lu6","texto":"Lubricantes › Si no se cambia","bloque":"lu6.10"}}]},{"id":"11-L15","titulo":"Qué pasa si no se cambia","palabras":204,"minutos":2,"fuentes":[{"vista":"v-lubricantes","sub":"lu6","texto":"Lubricantes › Si no se cambia"}],"cuerpo":[{"id":"lu6.1","t":"p","f":"Esta es la venta. No se vende aceite: se vende evitar lo que sigue.","cls":"lead"},{"id":"lu6.2","t":"li","f":"**Se agotan los aditivos.** Los detergentes se consumen neutralizando ácidos, los dispersantes se saturan de hollín, los antioxidantes se acaban. Queda base sin propiedades."},{"id":"lu6.3","t":"li","f":"**El aceite se oxida y espesa.** Con el calor y el oxígeno se vuelve más espeso y más ácido. Ya no fluye igual."},{"id":"lu6.4","t":"li","f":"**Aparecen los lodos.** La suciedad que ya nadie mantiene en suspensión se junta y se deposita: esa masa negra y pegajosa es el lodo."},{"id":"lu6.5","t":"li","f":"**Se tapan los conductos.** Los lodos obstruyen galerías y saturan el filtro. Cuando el filtro se satura, se abre la válvula de derivación y circula aceite sucio sin filtrar."},{"id":"lu6.6","t":"li","f":"**Sube la fricción y el desgaste.** Vuelve el contacto metal con metal. Cojinetes, anillos y árbol de levas empiezan a desgastarse."},{"id":"lu6.7","t":"li","f":"**El motor se sobrecalienta.** El aceite ya no refrigera, y el calor acelera todo lo anterior."},{"id":"lu6.8","t":"li","f":"**Falla.** Pérdida de compresión, consumo de aceite, ruido. En el extremo, motor fundido."},{"id":"lu6.9","t":"nota","f":"Sube el consumo de combustible. Baja la potencia. Ruido de motor. Huele a quemado o sale humo. Se enciende el testigo del aceite. **Cuando el cliente nota estos síntomas, el daño ya empezó.**","lbl":"Los síntomas que el cliente sí nota","k":"err"}],"preguntas":[{"id":"11-L15-P1","tipo":"opcion","enunciado":"Si no se cambia el aceite, ¿qué es lo primero que pasa?","opciones":["Se agotan los aditivos","Se funde el motor","Se tapa el radiador","Se rompe la bomba de agua"],"correcta":0,"cita":"Se agotan los aditivos.","fuente":{"vista":"v-lubricantes","sub":"lu6","texto":"Lubricantes › Si no se cambia","bloque":"lu6.2"}},{"id":"11-L15-P2","tipo":"vf","enunciado":"Cuando el filtro se satura, se abre la válvula de derivación y circula aceite sucio sin filtrar.","correcta":true,"cita":"Cuando el filtro se satura, se abre la válvula de derivación y circula aceite sucio sin filtrar.","fuente":{"vista":"v-lubricantes","sub":"lu6","texto":"Lubricantes › Si no se cambia","bloque":"lu6.5"}},{"id":"11-L15-P3","tipo":"opcion","enunciado":"¿Qué es el lodo?","opciones":["La suciedad que ya nadie mantiene en suspensión y se deposita: una masa negra y pegajosa","El aceite nuevo recién puesto","El agua del refrigerante","El polvo del filtro de aire"],"correcta":0,"cita":"esa masa negra y pegajosa es el lodo","fuente":{"vista":"v-lubricantes","sub":"lu6","texto":"Lubricantes › Si no se cambia","bloque":"lu6.4"}},{"id":"11-L15-P4","tipo":"opcion","enunciado":"Cuando el cliente ya nota los síntomas (más consumo, menos potencia, ruido), ¿qué quiere decir?","opciones":["Que el daño ya empezó","Que todavía no pasa nada","Que basta con agregar un aditivo","Que el aceite está nuevo"],"correcta":0,"cita":"Cuando el cliente nota estos síntomas, el daño ya empezó.","fuente":{"vista":"v-lubricantes","sub":"lu6","texto":"Lubricantes › Si no se cambia","bloque":"lu6.9"}}]}]},{"id":"11-M07","titulo":"Motores que piden más","lecciones":[{"id":"11-L16","titulo":"Motores turbo","palabras":201,"minutos":2,"fuentes":[{"vista":"v-lubricantes","sub":"lu7","texto":"Lubricantes › Turbo"},{"vista":"v-glosario","sub":"gl","texto":"Glosario › Glosario"}],"cuerpo":[{"id":"lu7.1","t":"p","f":"Cada vez más vehículos nuevos traen turbo, y son los que menos perdonan un aceite equivocado.","cls":"lead"},{"id":"lu7.2","t":"def","f":"**Qué aceite se usa:** Sintético, en **el grado exacto que pide el manual** y con la norma API vigente (SP o SQ). Filtro nuevo en cada cambio."},{"id":"lu7.3","t":"def","f":"**Si no se usa el correcto:** El aceite quieto en el turbo caliente **se carboniza** y tapa los conductos. El turbo se muere — y un turbo cuesta más que años de aceite bueno."},{"id":"lu7.4","t":"p","f":"Un turbocompresor gira a **más de 200.000 revoluciones por minuto** y trabaja tocando gases de escape que superan los 1.000 °C. El aceite es lo único que lubrica y enfría ese eje.","cls":"what"},{"id":"lu7.5","t":"nota","f":"**Uno:** no acelerar en frío. **Dos:** después de manejo exigente, un momento en ralentí antes de apagar. **Tres:** filtro nuevo en cada cambio. Son gratis para el cliente y te posicionan como alguien que sabe.","lbl":"Las tres recomendaciones de uso","k":"key"},{"id":"lu7.6","t":"nota","f":"Los turbo pequeños de gasolina sufren **LSPI**, una detonación anticipada que rompe pistones. Es lo que atacan API SP y SQ. Vender una API vieja en un turbo moderno no es ahorrar.","lbl":"Advertencia de norma","k":"err"},{"id":"gl.14","t":"def","f":"**Coquización:** Carbonización del aceite por calor extremo. Es lo que tapa los conductos de un turbo."}],"preguntas":[{"id":"11-L16-P1","tipo":"opcion","enunciado":"¿Qué aceite lleva un motor turbo?","opciones":["Sintético, en el grado exacto del manual y con la API vigente (SP o SQ)","Mineral 20W-50, para que sea más espeso","Cualquiera: el turbo no usa el aceite del motor","Aceite de transmisión"],"correcta":0,"cita":"Sintético, en el grado exacto que pide el manual y con la norma API vigente (SP o SQ).","fuente":{"vista":"v-lubricantes","sub":"lu7","texto":"Lubricantes › Turbo","bloque":"lu7.2"}},{"id":"11-L16-P2","tipo":"opcion","enunciado":"¿Qué es la coquización?","opciones":["La carbonización del aceite por calor extremo, que tapa los conductos del turbo","La mezcla de aceite con gasolina","El cambio de color del aceite nuevo","La espuma por llenar de más el cárter"],"correcta":0,"cita":"Carbonización del aceite por calor extremo. Es lo que tapa los conductos de un turbo.","fuente":{"vista":"v-glosario","sub":"gl","texto":"Glosario › Glosario","bloque":"gl.14"}},{"id":"11-L16-P3","tipo":"vf","enunciado":"Después de manejo exigente conviene dejar el motor un momento en ralentí antes de apagarlo.","correcta":true,"cita":"después de manejo exigente, un momento en ralentí antes de apagar","fuente":{"vista":"v-lubricantes","sub":"lu7","texto":"Lubricantes › Turbo","bloque":"lu7.5"}},{"id":"11-L16-P4","tipo":"opcion","enunciado":"¿A cuántas revoluciones gira un turbocompresor?","opciones":["A más de 200.000 rpm","A unas 6.000 rpm","A 13.000 rpm","A 1.000 rpm"],"correcta":0,"cita":"Un turbocompresor gira a más de 200.000 revoluciones por minuto","fuente":{"vista":"v-lubricantes","sub":"lu7","texto":"Lubricantes › Turbo","bloque":"lu7.4"}},{"id":"11-L16-P5","tipo":"vf","enunciado":"Vender una API vieja para un turbo moderno es una forma de ahorrarle al cliente.","correcta":false,"cita":"Vender una API vieja en un turbo moderno no es ahorrar.","fuente":{"vista":"v-lubricantes","sub":"lu7","texto":"Lubricantes › Turbo","bloque":"lu7.6"}}]},{"id":"11-L17","titulo":"Aceite de moto vs. de carro","palabras":280,"minutos":3,"fuentes":[{"vista":"v-motos","sub":"mo0","texto":"Motos › Motos"},{"vista":"v-motos","sub":"mo6","texto":"Motos › Auto vs. moto"}],"cuerpo":[{"id":"mo0.1","t":"def","f":"**Qué aceite se usa:** Moto de cambios (4T): **JASO MA2** en la viscosidad del manual — en Ecuador casi siempre **20W-50**. Scooter automático: **JASO MB**. Motor 2T: **JASO FD o API TC**, en la proporción que indique el fabricante."},{"id":"mo0.2","t":"def","f":"**Si no se usa el correcto:** Un aceite de carro, o un MB en moto de cambios, **hace patinar el embrague** por los modificadores de fricción. Y en 2T, más aceite del debido no protege más: hace humo y carboniza."},{"id":"mo6.1","t":"p","f":"Es la objeción más común del mostrador: «póngame el del carro, es más barato». Esta es la respuesta.","cls":"lead"},{"id":"mo6.2","t":"fila","f":"Aceite en el cárter — 5,0 L — 2,3 L","cols":["","Auto BMW Z4 · 2.500 cc","Moto Yamaha R6 · 600 cc"],"cells":["Aceite en el cárter","5,0 L","2,3 L"]},{"id":"mo6.3","t":"fila","f":"Potencia — 225 hp a 5.900 rpm — 120 hp a 13.000 rpm","cols":["","Auto BMW Z4 · 2.500 cc","Moto Yamaha R6 · 600 cc"],"cells":["Potencia","225 hp a 5.900 rpm","120 hp a 13.000 rpm"]},{"id":"mo6.4","t":"fila","f":"Potencia por litro — 90 hp/L — 200 hp/L","cols":["","Auto BMW Z4 · 2.500 cc","Moto Yamaha R6 · 600 cc"],"cells":["Potencia por litro","90 hp/L","200 hp/L"]},{"id":"mo6.5","t":"fila","f":"0 a 100 km/h — 7,7 s — 3,4 s","cols":["","Auto BMW Z4 · 2.500 cc","Moto Yamaha R6 · 600 cc"],"cells":["0 a 100 km/h","7,7 s","3,4 s"]},{"id":"mo6.6","t":"fila","f":"Qué lubrica el aceite — Solo el motor — Motor + caja + embrague","cols":["","Auto BMW Z4 · 2.500 cc","Moto Yamaha R6 · 600 cc"],"cells":["Qué lubrica el aceite","Solo el motor","Motor + caja + embrague"]},{"id":"mo6.7","t":"fila","f":"Enfriamiento — Radiador (agua) — Por aire, menos eficiente","cols":["","Auto BMW Z4 · 2.500 cc","Moto Yamaha R6 · 600 cc"],"cells":["Enfriamiento","Radiador (agua)","Por aire, menos eficiente"]},{"id":"mo6.8","t":"fila","f":"Temperatura de trabajo — Menor — Mayor","cols":["","Auto BMW Z4 · 2.500 cc","Moto Yamaha R6 · 600 cc"],"cells":["Temperatura de trabajo","Menor","Mayor"]},{"id":"mo6.9","t":"nota","f":"Menos aceite, más revoluciones, más calor y tres trabajos en vez de uno.","lbl":"La moto exige más con menos","k":"key"},{"id":"mo6.10","t":"nota","f":"La R6 saca **más del doble de potencia por litro** que el BMW, con **la mitad de aceite**. Cada gota trabaja el triple.","lbl":"La moto exige más con menos","k":"key"},{"id":"mo6.11","t":"nota","f":"El aceite de auto lleva modificadores de fricción para ahorrar combustible. En una moto de embrague húmedo eso hace que **el embrague patine**.","lbl":"El error que cuesta caro","k":"err"},{"id":"mo6.12","t":"nota","f":"Por eso existe la norma JASO. Un aceite de carro no la tiene.","lbl":"El error que cuesta caro","k":"err"},{"id":"mo6.13","t":"nota","f":"«Es medio litro de diferencia en precio contra un embrague. Y el embrague cuesta lo que treinta cambios de aceite.»","lbl":"Cómo cerrarlo en el mostrador","k":"key"}],"preguntas":[{"id":"11-L17-P1","tipo":"opcion","enunciado":"En una moto de cambios, ¿qué lubrica el aceite?","opciones":["Motor, caja y embrague","Solo el motor","Solo la cadena","El motor y el radiador"],"correcta":0,"cita":"Motor + caja + embrague","fuente":{"vista":"v-motos","sub":"mo6","texto":"Motos › Auto vs. moto","bloque":"mo6.6"}},{"id":"11-L17-P2","tipo":"vf","enunciado":"El aceite de carro, en una moto de embrague húmedo, hace patinar el embrague por sus modificadores de fricción.","correcta":true,"cita":"En una moto de embrague húmedo eso hace que el embrague patine.","fuente":{"vista":"v-motos","sub":"mo6","texto":"Motos › Auto vs. moto","bloque":"mo6.11"}},{"id":"11-L17-P3","tipo":"opcion","enunciado":"¿Con qué frase cierras «póngame el del carro, es más barato»?","opciones":["«Es medio litro de diferencia en precio contra un embrague»","«Bueno, el del carro también sirve»","«Le pongo menos aceite y queda igual»","«Lléveselo y, si patina, vuelve»"],"correcta":0,"cita":"Es medio litro de diferencia en precio contra un embrague.","fuente":{"vista":"v-motos","sub":"mo6","texto":"Motos › Auto vs. moto","bloque":"mo6.13"}},{"id":"11-L17-P4","tipo":"opcion","enunciado":"Para una moto de cambios en Ecuador, ¿qué aceite va casi siempre?","opciones":["JASO MA2 en 20W-50, la viscosidad del manual","JASO MB en 0W-20","Aceite de carro 5W-30","API TC de dos tiempos"],"correcta":0,"cita":"Moto de cambios (4T): JASO MA2 en la viscosidad del manual — en Ecuador casi siempre 20W-50.","fuente":{"vista":"v-motos","sub":"mo0","texto":"Motos › Motos","bloque":"mo0.1"}},{"id":"11-L17-P5","tipo":"vf","enunciado":"La moto exige más con menos: menos aceite, más revoluciones, más calor y tres trabajos en vez de uno.","correcta":true,"cita":"Menos aceite, más revoluciones, más calor y tres trabajos en vez de uno.","fuente":{"vista":"v-motos","sub":"mo6","texto":"Motos › Auto vs. moto","bloque":"mo6.9"}}]}]}]},{"id":"11-N4","titulo":"Vender","modulos":[{"id":"11-M
