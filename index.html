<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academia Austrofil — Lubricantes</title>
<meta name="description" content="Tutor para que los asesores de Austrofil aprendan la línea de lubricantes con el Manual de Campo y se certifiquen.">
<meta name="theme-color" content="#B4550F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Academia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/gota-192.png">
<link rel="apple-touch-icon" href="icons/gota-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root{
    color-scheme:light dark;
    --ground:#F1F3EF; --surface:#FCFCFA; --surface-2:#E8EBE4;
    --ink:#191C19; --ink-2:#565C54; --ink-3:#7C837A;
    --rule:#D8DCD2; --rule-strong:#BFC5B7;
    --amber:#B4550F; --amber-ink:#8E430C; --amber-wash:#F6E7D6;
    --steel:#2C4A5C; --steel-wash:#DDE6EB;
    --warn:#9A3B26; --warn-wash:#F6E0DA;
    --ok:#2F6B45; --ok-wash:#DFEEE2;
    --on-amber:#FFFFFF;
    --shadow:0 1px 2px rgba(25,28,25,.05), 0 8px 20px -12px rgba(25,28,25,.18);
    --tabbar:62px; --safe-b:env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#121513; --surface:#1A1E1A; --surface-2:#232823;
      --ink:#E9ECE6; --ink-2:#A2AB9E; --ink-3:#7E877B;
      --rule:#2D332C; --rule-strong:#3D453C;
      --amber:#E5943F; --amber-ink:#EFAA62; --amber-wash:#2E2318;
      --steel:#8FB3C6; --steel-wash:#1B2730;
      --warn:#DE8A72; --warn-wash:#33201A;
      --ok:#7FC796; --ok-wash:#18291D;
      --on-amber:#14110C;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --ground:#121513; --surface:#1A1E1A; --surface-2:#232823;
    --ink:#E9ECE6; --ink-2:#A2AB9E; --ink-3:#7E877B;
    --rule:#2D332C; --rule-strong:#3D453C;
    --amber:#E5943F; --amber-ink:#EFAA62; --amber-wash:#2E2318;
    --steel:#8FB3C6; --steel-wash:#1B2730;
    --warn:#DE8A72; --warn-wash:#33201A;
    --ok:#7FC796; --ok-wash:#18291D;
    --on-amber:#14110C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{color-scheme:light}
  :root[data-theme="dark"]{color-scheme:dark}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px)}
  h1,h2,h3{font-family:"Archivo",Impact,"Arial Narrow",sans-serif;
    font-variation-settings:"wdth" 112,"wght" 760;letter-spacing:-.018em;
    line-height:1.12;text-wrap:balance;margin:0}
  p{margin:0}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  input,textarea{font:inherit;color:inherit}
  [hidden]{display:none!important}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  /* ===== barra superior ===== */
  .appbar{position:sticky;top:0;z-index:60;background:var(--ground);border-bottom:1px solid var(--rule)}
  .appbar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:56px}
  .burger{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;
    border:1px solid var(--rule-strong);font-size:13px;font-weight:600;min-height:44px}
  .burger svg{width:18px;height:18px}
  .brandmark{display:flex;align-items:center;gap:7px;margin-right:auto;min-width:0;
    font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 118,"wght" 780;
    font-size:13.5px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  .drop{width:14px;height:17px;flex:0 0 auto}
  .drop path{stroke:var(--amber)}
  .iachip{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;min-height:44px;
    border:1px solid var(--rule-strong);font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .iachip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
  .iachip.on{border-color:var(--amber);color:var(--amber-ink)}
  .iachip.on .dot{background:var(--amber)}

  /* ===== menú lateral ===== */
  .scrim{position:fixed;inset:0;background:rgba(15,18,15,.44);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:290px;max-width:86vw;z-index:90;
    background:var(--surface);border-right:1px solid var(--rule);transform:translateX(-100%);
    transition:transform .2s ease;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:var(--safe-b)}
  .drawer.on{transform:translateX(0)}
  .dhead{display:flex;align-items:center;gap:8px;padding:14px 16px 12px;border-bottom:1px solid var(--rule)}
  .dclose{margin-left:auto;font-size:26px;line-height:1;color:var(--ink-3);padding:6px 10px;min-height:44px}
  .dnav{flex:1;overflow-y:auto;padding:10px}
  .di{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 10px;min-height:48px;
    border-radius:9px;font-size:15px;font-weight:500;color:var(--ink-2)}
  .di .em{width:22px;text-align:center;font-size:17px}
  .di.on{background:var(--amber-wash);color:var(--amber-ink);font-weight:600}
  .dver{padding:14px 18px 10px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em;
    color:var(--ink-3);border-top:1px solid var(--rule)}
  .dver b{color:var(--amber-ink);font-weight:600}

  /* ===== contenido ===== */
  main{max-width:720px;margin:0 auto;padding:0 16px calc(var(--tabbar) + var(--barra-h, 0px) + 28px + var(--safe-b))}
  body.sesion main{padding-bottom:calc(var(--barra-h, 0px) + 28px + var(--safe-b))}
  .vhead{padding:20px 0 14px}
  .kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--amber-ink);font-weight:600}
  .vhead h1{font-size:clamp(26px,7.2vw,34px);margin-top:8px}
  .vhead p{margin-top:9px;font-size:15.5px;color:var(--ink-2);max-width:60ch}
  .hlabel{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);font-weight:600;margin:24px 0 10px}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:15px}
  .stack{display:flex;flex-direction:column;gap:12px}
  .muted{color:var(--ink-2)}
  .small{font-size:13.5px}
  .tiny{font-size:12px;color:var(--ink-3)}
  .row{display:flex;align-items:center;gap:10px}
  .spacer{flex:1}

  /* botones grandes, para una mano */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 18px;
    border-radius:12px;background:var(--amber);color:var(--on-amber);font-weight:600;font-size:16px;text-align:center;
    box-shadow:var(--shadow);transition:transform .08s}
  .btn:active{transform:scale(.985)}
  .btn[disabled]{opacity:.45;box-shadow:none;cursor:default}
  a.btn,a.di{text-decoration:none}
  .btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--rule-strong);box-shadow:none}
  .btn.ghost{background:none;color:var(--amber-ink);box-shadow:none;min-height:48px}
  .btn.small{min-height:46px;font-size:14.5px;padding:10px 14px}
  .btns{display:flex;flex-direction:column;gap:10px}
  .btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* barra de acción fija abajo */
  .actionbar{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + var(--safe-b));z-index:50;
    background:linear-gradient(to top,var(--ground) 72%,transparent);padding:16px 16px 10px}
  body.sesion .actionbar{bottom:0;padding-bottom:calc(12px + var(--safe-b))}
  .actionbar-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}

  /* pestañas abajo */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--surface);border-top:1px solid var(--rule);
    padding-bottom:var(--safe-b)}
  body.sesion .tabbar{display:none}
  .tabbar-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar)}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;
    font-weight:600;color:var(--ink-3);position:relative}
  .tab svg{width:23px;height:23px}
  .tab.on{color:var(--amber-ink)}
  .tab.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--amber)}
  .tab .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;padding:0 5px;
    background:var(--amber);color:var(--on-amber);font-size:10.5px;line-height:18px;text-align:center}

  /* ===== ruta ===== */
  .lineas{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
  .lineas::-webkit-scrollbar{display:none}
  .lchip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;min-height:44px;
    background:var(--surface);border:1px solid var(--rule);font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .lchip .code{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--amber-ink);
    background:var(--amber-wash);padding:1px 6px;border-radius:4px}
  .lchip.on{border-color:var(--amber);color:var(--ink);box-shadow:inset 0 -3px 0 var(--amber)}
  .lchip.soon{opacity:.62}
  .lchip.soon small{font-weight:500;font-size:11px;color:var(--ink-3)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:11px 12px}
  .kpi b{display:block;font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 115,"wght" 770;font-size:22px;line-height:1.05}
  .kpi span{font-size:11.5px;color:var(--ink-3);line-height:1.25;display:block;margin-top:3px}
  .nivel{margin-top:18px}
  .nhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .nhead h2{font-size:20px}
  .nhead .st{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
  .nivel.lock .nhead h2{color:var(--ink-3)}
  .modulo{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-bottom:10px}
  .mtit{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3);font-weight:600;padding:11px 14px 4px}
  .lec{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;min-height:60px;
    border-top:1px solid var(--rule)}
  .mtit + .lec{border-top:0}
  .lec .ico{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600}
  .lec .ico svg{width:17px;height:17px}
  .lec.ok .ico{background:var(--ok-wash);color:var(--ok)}
  .lec.next .ico{background:var(--amber);color:var(--on-amber)}
  .lec .tx{flex:1;min-width:0}
  .lec .tx b{display:block;font-size:15px;font-weight:600;line-height:1.3}
  .lec .tx span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .lec[disabled]{opacity:.55;cursor:default}
  .examcard{border:1.5px dashed var(--rule-strong);border-radius:12px;padding:16px;margin-top:18px}
  .examcard.on{border:1.5px solid var(--amber);background:var(--amber-wash)}
  .examcard h2{font-size:19px}

  /* ===== lección ===== */
  .lhead{padding:18px 0 6px}
  .crumb{font-size:12.5px;color:var(--ink-3)}
  .lhead h1{font-size:clamp(25px,7vw,32px);margin-top:6px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .pill{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
    padding:4px 8px;border-radius:5px;background:var(--surface-2);color:var(--ink-2)}
  .pill.amber{background:var(--amber-wash);color:var(--amber-ink)}
  .pill.ia{background:var(--steel-wash);color:var(--steel)}
  .pill.ok{background:var(--ok-wash);color:var(--ok)}
  .cuerpo{display:flex;flex-direction:column;gap:12px;margin-top:14px;font-size:15.5px}
  .cuerpo h3{font-size:18px;margin:12px 0 0}
  .cuerpo h4{margin:6px 0 0;font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 110,"wght" 740;font-size:15.5px}
  .cuerpo .lead{font-size:16.5px;color:var(--ink)}
  .cuerpo ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
  .call{border-radius:10px;padding:13px 14px;font-size:15px;display:flex;flex-direction:column;gap:6px;background:var(--amber-wash)}
  .call .lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--amber-ink)}
  .call.err{background:var(--warn-wash)} .call.err .lbl{color:var(--warn)}
  .call.src{background:var(--steel-wash)} .call.src .lbl{color:var(--steel)}
  .call.qa{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--steel)}
  .call.qa .lbl{color:var(--steel)}
  .filas{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:10px;background:var(--surface);overflow:hidden}
  .fila{padding:11px 13px;border-top:1px solid var(--rule);font-size:14.5px}
  .fila:first-child{border-top:0}
  .fila > b{display:block;font-weight:600;color:var(--ink)}
  .fila .c{display:block;color:var(--ink-2);margin-top:2px}
  .fila .c i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-3);margin-right:5px}
  .dato{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:11px 13px;font-size:14.5px}
  .dato b{color:var(--amber-ink)}
  .marcas{display:flex;flex-wrap:wrap;gap:6px}
  .marca{font-size:12.5px;padding:4px 9px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule)}
  .marca.own{background:var(--amber-wash);color:var(--amber-ink);border-color:transparent;font-weight:600}
  .marca.grp{background:var(--steel-wash);color:var(--steel);border-color:transparent}
  .cab{font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 112,"wght" 760;font-size:17px;margin-top:6px}
  .cab small{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-3);font-weight:600;margin-left:6px}
  .fuentes{margin-top:18px;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:10px}

  /* ===== preguntas ===== */
  .qtop{display:flex;align-items:center;gap:10px;padding:14px 0 4px}
  .qbar{flex:1;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
  .qbar i{display:block;height:100%;background:var(--amber);border-radius:4px;transition:width .2s}
  .qx{min-height:44px;min-width:44px;font-size:24px;color:var(--ink-3);line-height:1}
  .qn{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
  .qtipo{margin-top:10px}
  .qtext{font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 104,"wght" 680;font-size:20px;line-height:1.3;
    letter-spacing:-.01em;margin:8px 0 16px;text-wrap:pretty}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:12px 14px;
    border-radius:12px;background:var(--surface);border:1.5px solid var(--rule-strong);font-size:15.5px;line-height:1.35}
  .opt .k{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--rule-strong);display:flex;
    align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--ink-3)}
  .opt.sel{border-color:var(--amber);background:var(--amber-wash)}
  .opt.sel .k{border-color:var(--amber);background:var(--amber);color:var(--on-amber)}
  .opt.ok{border-color:var(--ok);background:var(--ok-wash)}
  .opt.ok .k{border-color:var(--ok);background:var(--ok);color:var(--surface)}
  .opt.bad{border-color:var(--warn);background:var(--warn-wash)}
  .opt.bad .k{border-color:var(--warn);background:var(--warn);color:var(--surface)}
  .opt[disabled]{cursor:default}
  .vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .vf .opt{justify-content:center;font-weight:600;min-height:64px}
  .match{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .mcol{display:flex;flex-direction:column;gap:9px}
  .mi{position:relative;min-height:58px;padding:10px 11px;border-radius:11px;background:var(--surface);
    border:1.5px solid var(--rule-strong);font-size:14px;line-height:1.3;text-align:left;width:100%}
  .mi.sel{border-color:var(--amber);background:var(--amber-wash)}
  .mi.paired{border-style:solid}
  .mi .tagn{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;font-size:11.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:"IBM Plex Mono",monospace}
  .mi.ok{border-color:var(--ok);background:var(--ok-wash)}
  .mi.bad{border-color:var(--warn);background:var(--warn-wash)}
  .mhint{font-size:13px;color:var(--ink-3);margin-top:10px}
  .fb{margin-top:16px;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
  .fb.ok{background:var(--ok-wash)} .fb.bad{background:var(--warn-wash)}
  .fb h3{font-size:17px} .fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--warn)}
  .cita{font-size:14.5px;border-left:3px solid var(--amber);padding-left:11px;color:var(--ink)}
  .cita small{display:block;margin-top:5px;font-size:12px;color:var(--ink-3)}
  .iabox{font-size:14.5px;white-space:pre-wrap;background:var(--surface);border:1px solid var(--rule);border-radius:10px;
    padding:11px 12px;max-height:46vh;overflow:auto}
  .iabox.dots::after{content:"…";animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .ianote{font-size:13px;color:var(--ink-2)}
  .ianote.err{color:var(--warn)}

  /* ===== resultado ===== */
  .score{text-align:center;padding:26px 0 8px}
  .score .big{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:clamp(46px,15vw,66px);line-height:1;letter-spacing:-.03em}
  .score .big.ok{color:var(--ok)} .score .big.bad{color:var(--warn)}
  .score h1{font-size:24px;margin-top:12px}
  .score p{margin-top:8px;color:var(--ink-2)}
  .fallo{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:7px}
  .fallo .q{font-weight:600;font-size:15px}
  .fallo .a{font-size:14px}
  .fallo .a b{color:var(--ok)}

  /* ===== repaso / avance ===== */
  .racha{display:flex;align-items:center;gap:14px}
  .racha .n{font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 115,"wght" 790;font-size:40px;line-height:1;color:var(--amber)}
  .cajas{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
  .caja{background:var(--surface-2);border-radius:8px;padding:8px 4px;text-align:center}
  .caja b{display:block;font-family:"IBM Plex Mono",monospace;font-size:17px}
  .caja span{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
  .caja small{display:block;font-size:10.5px;color:var(--ink-3)}
  pre.export{white-space:pre-wrap;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.5;margin:0;
    background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px}
  .codebox{font-family:"IBM Plex Mono",monospace;font-size:11.5px;word-break:break-all;max-height:120px;overflow:auto;
    background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:13.5px;font-weight:600}
  .inp{width:100%;min-height:52px;padding:12px 14px;border-radius:11px;border:1.5px solid var(--rule-strong);
    background:var(--surface);font-size:16px}
  textarea.inp{min-height:120px;resize:vertical;line-height:1.45}
  .inp:focus{border-color:var(--amber);outline:none}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .seg button{min-height:46px;border-radius:10px;border:1.5px solid var(--rule-strong);background:var(--surface);font-size:14px;font-weight:600}
  .seg button.on{border-color:var(--amber);background:var(--amber-wash);color:var(--amber-ink)}
  .cset-steps{margin:6px 0 0;padding-left:20px;font-size:14.5px;display:flex;flex-direction:column;gap:5px}
  .cset-steps a{color:var(--amber-ink);font-weight:600}
  .stt{font-size:13.5px;color:var(--ink-2)} .stt.ok{color:var(--ok)} .stt.err{color:var(--warn)}

  /* ===== simulador ===== */
  .obj{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;min-height:64px;
    background:var(--surface);border:1px solid var(--rule);border-radius:12px}
  .obj .q{font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 108,"wght" 720;font-size:16.5px;flex:1}
  .obj .st{font-size:12px;color:var(--ink-3)}
  .cliente{background:var(--surface);border:1px solid var(--rule);border-radius:14px 14px 14px 4px;padding:14px 15px;
    font-size:18px;font-family:"Archivo",sans-serif;font-variation-settings:"wdth" 104,"wght" 700;margin-top:6px}
  .paso{margin-top:18px}
  .crit{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .crit div{display:flex;gap:9px;font-size:14.5px}
  .crit .s{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .crit .s.ok{background:var(--ok-wash);color:var(--ok)} .crit .s.bad{background:var(--warn-wash);color:var(--warn)}

  /* ===== varios ===== */
  .banner{position:fixed;left:12px;right:12px;bottom:calc(var(--tabbar) + 12px + var(--safe-b));z-index:70;max-width:696px;margin:0 auto;
    background:var(--ink);color:var(--ground);border-radius:12px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;
    box-shadow:var(--shadow);font-size:14.5px}
  body.sesion .banner{bottom:calc(96px + var(--safe-b))}
  .banner button{min-height:44px;padding:0 14px;border-radius:9px;background:var(--amber);color:var(--on-amber);font-weight:600;white-space:nowrap}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 22px + var(--safe-b));z-index:75;
    background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;font-size:14px;max-width:88vw;box-shadow:var(--shadow)}
  .sheet-bg{position:fixed;inset:0;z-index:95;background:rgba(15,18,15,.5);display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:720px;background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px calc(16px + var(--safe-b));
    display:flex;flex-direction:column;gap:12px}
  .sheet h2{font-size:20px}
  .welcome{padding:34px 0 0;display:flex;flex-direction:column;gap:16px}
  .welcome .gota{width:52px;height:64px}
  .welcome h1{font-size:clamp(28px,8vw,38px)}
  canvas.cert{width:100%;height:auto;border-radius:10px;border:1px solid var(--rule);background:#fff;display:block}
  .lockmsg{font-size:13.5px;color:var(--ink-3)}
  @media (min-width:720px){ .match{gap:12px} }
</style>
</head>
