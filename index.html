":"me2","texto":"Mercado › Dónde está el negocio › El mapa del país","bloque":"me2.17"}},{"id":"11-L21-P5","tipo":"vf","enunciado":"El filtro de aceite mueve más unidades que ninguna otra referencia porque va atado a cada cambio.","correcta":true,"cita":"Atado a cada cambio. Mueve más unidades que ninguna otra referencia.","fuente":{"vista":"v-mercado","sub":"me2","texto":"Mercado › Dónde está el negocio › Qué rota","bloque":"me2.5"}}]}]},{"id":"11-M10","titulo":"Cómo se vende","lecciones":[{"id":"11-L22","titulo":"Cómo se arma la conversación","palabras":233,"minutos":2,"fuentes":[{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario"},{"qa":"como vender argumentario canasta lineas por factura","texto":"Banco de respuestas del manual"},{"vista":"v-lubricantes","sub":"lu1","texto":"Lubricantes › Qué es lubricar"}],"cuerpo":[{"id":"ve1.1","t":"p","f":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual? Vendes: el intervalo, no el envase. Si el cliente compara precio de galón, cámbiale la métrica a costo por kilómetro.","h4":"Lubricantes","cls":"ask"},{"id":"ve1.2","t":"p","f":"Pregunta: ¿cuándo cambió el de cabina? Vendes: protección del aceite que acaba de comprar. Nunca sale un lubricante solo de tu pedido.","h4":"Filtros","cls":"ask"},{"id":"ve1.5","t":"p","f":"Pregunta: ¿es 2T o 4T, y tiene embrague o es automática? Vendes: la norma JASO correcta. Aquí el error se paga con un embrague.","h4":"Aceite de moto","cls":"ask"},{"id":"ve1.8","t":"nota","f":"El portafolio está armado en **canastas, no en líneas sueltas**: el lubricante arrastra el filtro, el filtro abre la conversación de mantenimiento, el mantenimiento arrastra refrigerante y freno, el limpiador cierra el pedido. El indicador que conviene medir es **líneas por factura**, no solo monto.","lbl":"La idea que ordena todo","k":"key"},{"t":"qa","f":"El portafolio se vende en canastas, no en líneas sueltas: el lubricante arrastra el filtro, el filtro abre la conversación de mantenimiento, el mantenimiento arrastra refrigerante y líquido de freno, y el limpiador cierra el pedido. Un asesor que vende solo lubricante deja cinco líneas sobre la mesa en cada visita. El indicador que conviene medir es líneas por factura, no solo monto.","qa":"como vender argumentario canasta lineas por factura"},{"id":"lu1.9","t":"nota","f":"Un motor bien lubricado **dura más, gasta menos combustible, entrega su potencia y va menos al taller**. Todo eso sale de un galón que cuesta una fracción de abrir un motor. Ese es el argumento.","lbl":"El beneficio, dicho como lo entiende el cliente","k":"key"}],"preguntas":[{"id":"11-L22-P1","tipo":"opcion","enunciado":"En lubricantes, ¿qué preguntas antes de opinar?","opciones":["¿Qué vehículo, cuántos kilómetros tiene y qué dice el manual?","¿Cuánto quiere gastar?","¿Qué marca le gusta?","¿De qué tamaño quiere el envase?"],"correcta":0,"cita":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual?","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloque":"ve1.1"}},{"id":"11-L22-P2","tipo":"opcion","enunciado":"Cuando vendes lubricante, ¿qué vendes en realidad?","opciones":["El intervalo, no el envase","El envase más grande","El color del aceite","La marca más cara"],"correcta":0,"cita":"Vendes: el intervalo, no el envase.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloque":"ve1.1"}},{"id":"11-L22-P3","tipo":"vf","enunciado":"Si el cliente compara precio de galón, le cambias la métrica a costo por kilómetro.","correcta":true,"cita":"Si el cliente compara precio de galón, cámbiale la métrica a costo por kilómetro.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloque":"ve1.1"}},{"id":"11-L22-P4","tipo":"opcion","enunciado":"¿Qué indicador conviene medir?","opciones":["Líneas por factura, no solo monto","Solo el monto vendido","Cuántas visitas haces","Cuántos galones regalas"],"correcta":0,"cita":"El indicador que conviene medir es líneas por factura, no solo monto.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloque":"ve1.8"}},{"id":"11-L22-P5","tipo":"emparejar","enunciado":"Empareja cada venta con la pregunta que la abre.","pares":[["Lubricantes","¿Qué vehículo, cuántos kilómetros tiene y qué dice el manual?"],["Filtros","¿Cuándo cambió el de cabina?"],["Aceite de moto","¿Es 2T o 4T, y tiene embrague o es automática?"]],"cita":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual? Vendes: el intervalo, no el envase. Si el cliente compara precio de galón, cámbiale la métrica a costo por kilómetro. · Pregunta: ¿cuándo cambió el de cabina? Vendes: protección del aceite que acaba de comprar. Nunca sale un lubricante solo de tu pedido. · Pregunta: ¿es 2T o 4T, y tiene embrague o es automática? Vendes: la norma JASO correcta. Aquí el error se paga con un embrague.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloques":["ve1.1","ve1.2","ve1.5"]}}]},{"id":"11-L23","titulo":"Presentaciones: de galón a balde","palabras":132,"minutos":2,"fuentes":[{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad"},{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor"}],"cuerpo":[{"id":"lu4.21","t":"h3","f":"Presentaciones","h3":"Presentaciones"},{"id":"lu4.22","t":"fila","f":"**Litro y galón** — Consumidor final, moto, taller pequeño. Rotación alta, ticket bajo.","cols":["Presentación","A quién va"],"cells":["**Litro y galón**","Consumidor final, moto, taller pequeño. Rotación alta, ticket bajo."],"h3":"Presentaciones"},{"id":"lu4.23","t":"fila","f":"**Balde** — Lubricadora y taller establecido. El salto de volumen más rentable de conseguir.","cols":["Presentación","A quién va"],"cells":["**Balde**","Lubricadora y taller establecido. El salto de volumen más rentable de conseguir."],"h3":"Presentaciones"},{"id":"lu4.24","t":"fila","f":"**Tanque** — Flota, industria, maquinaria. Ticket alto, decisión de gerencia.","cols":["Presentación","A quién va"],"cells":["**Tanque**","Flota, industria, maquinaria. Ticket alto, decisión de gerencia."],"h3":"Presentaciones"},{"id":"lu4.25","t":"nota","f":"Subir a un cliente de galón a balde, o de balde a tanque, es más barato que conseguir uno nuevo. La pregunta que abre esa venta: **\"¿cuánto aceite mueve usted al mes?\"**","lbl":"Dónde está el crecimiento fácil","k":"key","h3":"Presentaciones"},{"id":"lu5.11","t":"nota","f":"Cada motor tiene su capacidad, y **eso define cuánto aceite vendes en cada cambio**: auto liviano 3 a 5 litros, camioneta o SUV 5 a 7, moto 0,8 a 1,5, camión o bus 15 a 40. Por eso el diésel se vende en balde y el liviano en galón.","lbl":"La capacidad del cárter es tu unidad de venta","k":"key","h3":"El cárter: dónde vive el aceite"}],"preguntas":[{"id":"11-L23-P1","tipo":"emparejar","enunciado":"Empareja cada presentación con a quién va.","pares":[["Litro y galón","Consumidor final, moto, taller pequeño"],["Balde","Lubricadora y taller establecido"],["Tanque","Flota, industria, maquinaria"]],"cita":"Litro y galón — Consumidor final, moto, taller pequeño. Rotación alta, ticket bajo. · Balde — Lubricadora y taller establecido. El salto de volumen más rentable de conseguir. · Tanque — Flota, industria, maquinaria. Ticket alto, decisión de gerencia.","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › Presentaciones","bloques":["lu4.22","lu4.23","lu4.24"]}},{"id":"11-L23-P2","tipo":"opcion","enunciado":"¿Qué pregunta abre la venta de subir de galón a balde?","opciones":["«¿Cuánto aceite mueve usted al mes?»","«¿Qué color le gusta?»","«¿Tiene carro nuevo?»","«¿Cuántos empleados tiene?»"],"correcta":0,"cita":"¿cuánto aceite mueve usted al mes?","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › Presentaciones","bloque":"lu4.25"}},{"id":"11-L23-P3","tipo":"vf","enunciado":"Subir a un cliente de galón a balde es más barato que conseguir un cliente nuevo.","correcta":true,"cita":"Subir a un cliente de galón a balde, o de balde a tanque, es más barato que conseguir uno nuevo.","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › Presentaciones","bloque":"lu4.25"}},{"id":"11-L23-P4","tipo":"opcion","enunciado":"¿Por qué el diésel se vende en balde y el liviano en galón?","opciones":["Por la capacidad del cárter: un camión o bus lleva de 15 a 40 litros","Porque el diésel es más barato","Porque no hay galones para diésel","Porque el balde dura más tiempo abierto"],"correcta":0,"cita":"camión o bus 15 a 40. Por eso el diésel se vende en balde y el liviano en galón.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El cárter: dónde vive el aceite","bloque":"lu5.11"}}]}]}]}],"objeciones":[{"id":"11-O1","titulo":"Está caro","cliente":"Está caro.","situacion":"Le ofreces el sintético en el grado que pide el manual de su vehículo y el cliente te dice:","pasos":[{"id":"11-O1-P1","tipo":"opcion","enunciado":"¿Qué haces primero?","opciones":["Pregunto qué vehículo es, cuántos kilómetros tiene y qué dice el manual","Le bajo el precio de una vez para no perder la venta","Le digo que lo caro siempre es mejor","Le ofrezco el más barato sin preguntar nada"],"correcta":0,"cita":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual?","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloque":"ve1.1"},"paso":"Pregunta antes de opinar","explicaciones":["Así arranca el manual: primero preguntas, después vendes.","Bajar precio antes de saber qué pide el motor es regalar margen.","El manual no vende «caro es mejor»: vende kilómetro protegido.","Sin preguntar no sabes si ese aceite sirve para ese motor."]},{"id":"11-O1-P2","tipo":"opcion","enunciado":"Su motor pide sintético. ¿Con qué argumento respondes?","opciones":["No se vende litro, se vende kilómetro protegido: un sintético de 10.000 km cuesta menos por kilómetro que un mineral de 4.000","Que el sintético dura para siempre y no hay que cambiarlo","Que el precio lo pone la marca y no se puede hacer nada","Que el mineral daña cualquier motor"],"correcta":0,"cita":"No se vende litro, se vende kilómetro protegido. Un sintético de 10.000 km cuesta menos por kilómetro que un mineral de 4.000.","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › Mineral, semisintético y sintético","bloque":"lu4.20"},"paso":"Argumenta con el manual","explicaciones":["Ese es el argumento del manual: compara kilómetros, no galones.","Falso: el sintético también tiene intervalo.","No es argumento: el cliente se queda con su objeción.","El manual no dice eso: el mineral es precio de entrada, con intervalos cortos."]},{"id":"11-O1-P3","tipo":"opcion","enunciado":"El cliente sigue dudando. ¿Cómo cierras?","opciones":["Si aún quiere precio, lo bajo de escalón dentro de la misma marca: no pierdo la venta","Le digo que vuelva cuando tenga plata","Le repito el precio y espero","Le pongo el más barato aunque no cumpla el manual"],"correcta":0,"cita":"Y si el cliente no cede, bájalo de escalón dentro de la misma marca: no pierdas la venta.","fuente":{"qa":"argumento subir sintetico convencer kilometro protegido escalon","texto":"Banco de respuestas del manual"},"paso":"Cierra con una propuesta","explicaciones":["Es lo que dice el manual: no pierdas la venta, bájala de escalón.","Así pierdes la venta y el cliente se va a otro mostrador.","Sin propuesta no hay cierre.","Nunca por debajo de lo que pide el manual del vehículo."]}],"manual":[{"f":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual? Vendes: el intervalo, no el envase. Si el cliente compara precio de galón, cámbiale la métrica a costo por kilómetro.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario"}},{"f":"No se vende litro, se vende **kilómetro protegido**. Un sintético de 10.000 km cuesta menos por kilómetro que un mineral de 4.000. El cliente que compara precio de galón compara la métrica equivocada.","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad › Mineral, semisintético y sintético"}},{"f":"No compares galones, compara kilómetros. Un sintético que aguanta 10.000 km cuesta menos por kilómetro que un mineral de 4.000, aunque el envase valga más. Suma el tiempo del vehículo parado en cada cambio y la protección en el arranque en frío, que es donde se desgasta el motor. Y si el cliente no cede, bájalo de escalón dentro de la misma marca: no pierdas la venta.","fuente":{"qa":"argumento subir sintetico convencer kilometro protegido escalon","texto":"Banco de respuestas del manual"}},{"f":"Un motor bien lubricado **dura más, gasta menos combustible, entrega su potencia y va menos al taller**. Todo eso sale de un galón que cuesta una fracción de abrir un motor. Ese es el argumento.","fuente":{"vista":"v-lubricantes","sub":"lu1","texto":"Lubricantes › Qué es lubricar"}}]},{"id":"11-O2","titulo":"El otro es más barato","cliente":"El otro es más barato.","situacion":"El cliente compara tu galón con el de otro local y te dice:","pasos":[{"id":"11-O2-P1","tipo":"opcion","enunciado":"¿Qué haces primero?","opciones":["Pregunto qué vehículo es, cuántos kilómetros tiene y qué dice el manual, para comparar lo comparable","Le digo que el otro es de mala calidad","Le igualo el precio sin preguntar","Le digo que entonces compre allá"],"correcta":0,"cita":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual?","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloque":"ve1.1"},"paso":"Pregunta antes de opinar","explicaciones":["Primero preguntas: así sabes qué necesita su motor y qué está comparando.","Hablar mal del otro no responde la objeción.","Igualar precio sin saber qué compara es regalar margen.","Pierdes la venta sin pelearla."]},{"id":"11-O2-P2","tipo":"opcion","enunciado":"¿Qué argumento usas?","opciones":["Que no compare galones sino kilómetros: le cambias la métrica a costo por kilómetro","Que todos los aceites son iguales","Que el más caro siempre tiene más aditivos","Que el otro local no da factura"],"correcta":0,"cita":"Si el cliente compara precio de galón, cámbiale la métrica a costo por kilómetro.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloque":"ve1.1"},"paso":"Argumenta con el manual","explicaciones":["Así lo dice el manual: si compara precio de galón, cámbiale la métrica.","Si todos fueran iguales, ganaría siempre el más barato.","El manual no dice eso: la diferencia está en la base y los aditivos, y se mide en kilómetros.","No es un argumento técnico."]},{"id":"11-O2-P3","tipo":"opcion","enunciado":"Aun así el cliente quiere precio. ¿Cómo cierras?","opciones":["Le ofrezco la marca de volumen del portafolio: no pierdo la venta, la bajo de escalón","Lo dejo ir","Le hago todo el descuento que pida","Le vendo uno que no cumple la norma del manual"],"correcta":0,"cita":"Si aún así el cliente quiere precio, ahí está la marca de volumen del portafolio — no pierdas la venta, bájala de escalón.","fuente":{"qa":"objecion mas barato competencia precio caro cliente dice otro economico","texto":"Banco de respuestas del manual"},"paso":"Cierra con una propuesta","explicaciones":["Es el cierre del manual: no pierdas la venta, bájala de escalón.","Dejarlo ir es perder la venta.","Regalar margen no es cerrar bien.","Nunca por debajo de lo que pide el manual del vehículo."]}],"manual":[{"f":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual? Vendes: el intervalo, no el envase. Si el cliente compara precio de galón, cámbiale la métrica a costo por kilómetro.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario"}},{"f":"No compares galones, compara kilómetros. Un sintético de 10.000 km cuesta menos por kilómetro que un mineral de 4.000, aunque el galón valga más. Y agrega el costo de oportunidad: cada cambio es una visita al taller, tiempo del vehículo parado. Si aún así el cliente quiere precio, ahí está la marca de volumen del portafolio — no pierdas la venta, bájala de escalón.","fuente":{"qa":"objecion mas barato competencia precio caro cliente dice otro economico","texto":"Banco de respuestas del manual"}},{"f":"Dos cosas, nada más: una base y un paquete de aditivos. Toda la diferencia entre un aceite barato y uno caro está en esas dos.","fuente":{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho"}}]},{"id":"11-O3","titulo":"Yo siempre pongo 20W-50","cliente":"Yo siempre pongo 20W-50.","situacion":"El cliente tiene un auto moderno. Le comentas que hay que ver lo que pide su manual y te dice:","pasos":[{"id":"11-O3-P1","tipo":"opcion","enunciado":"¿Qué haces primero?","opciones":["Pregunto qué vehículo es, cuántos kilómetros tiene y qué dice el manual","Le vendo el 20W-50 sin preguntar","Le digo que el 20W-50 ya no sirve para nada","Le pregunto qué marca usa su mecánico"],"correcta":0,"cita":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual?","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloque":"ve1.1"},"paso":"Pregunta antes de opinar","explicaciones":["Sin saber qué pide el manual no puedes opinar sobre la viscosidad.","Puede ser la viscosidad equivocada para ese motor.","Falso: el 20W-50 es correcto para buena parte del parque viejo.","La viscosidad no la decide la marca ni el mecánico: la manda el fabricante del motor."]},{"id":"11-O3-P2","tipo":"opcion","enunciado":"Su manual pide 5W-30. ¿Qué le explicas?","opciones":["Que en un motor que pide 5W-30 el 20W-50 no alcanza a llegar a tiempo a las galerías en el arranque: no es más protección, es protección más tarde","Que más espeso siempre protege más","Que la viscosidad depende del clima de la ciudad","Que el 20W son 20 grados de temperatura"],"correcta":0,"cita":"en un motor moderno que pide 5W-30 el 20W-50 no alcanza a llegar a tiempo a las galerías en el arranque. No es darle más protección, es dársela más tarde.","fuente":{"qa":"objecion siempre pongo 20w50 costumbre taller","texto":"Banco de respuestas del manual"},"paso":"Argumenta con el manual","explicaciones":["Es la respuesta del manual a esta objeción.","Falso: más espeso no es más protección.","Falso: la viscosidad la manda el fabricante del motor, no el clima.","Falso: el 20W es una posición en la escala SAE, no grados."]},{"id":"11-O3-P3","tipo":"opcion","enunciado":"¿Cómo cierras?","opciones":["Le propongo el aceite en la viscosidad que pide su manual: lo que manda es el manual, no la costumbre","Le vendo el 20W-50 para no discutir","Le recomiendo mezclar mitad y mitad","Le digo que pregunte en otro lado"],"correcta":0,"cita":"Lo que manda es el manual, no la costumbre.","fuente":{"qa":"objecion siempre pongo 20w50 costumbre taller","texto":"Banco de respuestas del manual"},"paso":"Cierra con una propuesta","explicaciones":["Así cierra el manual: manda el manual del vehículo.","Le vendes un aceite que llega tarde en el arranque.","Mezclar no es una solución de rutina.","Pierdes la venta y la confianza del cliente."]}],"manual":[{"f":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual? Vendes: el intervalo, no el envase. Si el cliente compara precio de galón, cámbiale la métrica a costo por kilómetro.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario"}},{"f":"Es la objeción más común del parque ecuatoriano. La respuesta es: el 20W-50 es correcto para la mayoría del parque viejo, pero en un motor moderno que pide 5W-30 el 20W-50 no alcanza a llegar a tiempo a las galerías en el arranque. No es darle más protección, es dársela más tarde. Lo que manda es el manual, no la costumbre.","fuente":{"qa":"objecion siempre pongo 20w50 costumbre taller","texto":"Banco de respuestas del manual"}},{"f":"La viscosidad **la manda el fabricante del motor**, no el clima, no el precio y no la costumbre del taller. Más espeso no es más protección.","fuente":{"vista":"v-lubricantes","sub":"lu4","texto":"Lubricantes › Viscosidad"}},{"f":"Con el motor apagado el aceite está abajo. Al arrancar, la bomba tarda un instante en subirlo, y en ese instante hay piezas girando con poca película. **Ahí ocurre la mayor parte del desgaste.** Eso resuelve el número antes de la W.","fuente":{"vista":"v-lubricantes","sub":"lu5","texto":"Lubricantes › El motor › El recorrido del aceite"}},{"f":"El 20W-50 domina porque el parque es viejo. Pero entran más de 100.000 vehículos nuevos al año: los híbridos ya son el 14,8 % de la venta y los eléctricos el 3,3 %. Ese parque pide **0W-20 y 5W-30 sintéticos**.","fuente":{"vista":"v-mercado","sub":"me2","texto":"Mercado › Dónde está el negocio › El mapa del país"}}]},{"id":"11-O4","titulo":"No conozco esa marca","cliente":"No conozco esa marca.","situacion":"Le ofreces AROIL, una de las cinco marcas del 80 %, y el cliente te dice:","pasos":[{"id":"11-O4-P1","tipo":"opcion","enunciado":"¿Qué haces primero?","opciones":["Pregunto qué vehículo es, cuántos kilómetros tiene y qué dice el manual","Le cambio de marca sin preguntar nada","Le digo que todas las marcas son iguales","Le pregunto cuál es su marca favorita y se la vendo"],"correcta":0,"cita":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual?","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloque":"ve1.1"},"paso":"Pregunta antes de opinar","explicaciones":["Con lo que pide su manual sabes qué tiene que decir el envase.","Cambiar de marca sin saber qué necesita el motor no resuelve nada.","No es cierto: cada envase dice su viscosidad y su norma.","La marca favorita no dice si calza con el motor."]},{"id":"11-O4-P2","tipo":"opcion","enunciado":"¿Qué le muestras?","opciones":["El envase: la viscosidad SAE que pide su manual y la norma API igual o superior; con eso sabe que calza","Que la marca no importa nunca","Que si es barata es mala","Que todas las marcas son del mismo dueño"],"correcta":0,"cita":"En un envase hay siempre dos datos: la viscosidad SAE y la norma API. La viscosidad la manda el fabricante del motor; la norma se elige igual o superior a la del manual.","fuente":{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas","bloque":"lu3.10"},"paso":"Argumenta con el manual","explicaciones":["Es la regla del manual que resuelve casi cualquier consulta.","Lo que importa es que cumpla viscosidad y norma.","El precio no dice si calza con el motor.","Falso: solo Chevron, Havoline, Texaco y Ursa son del mismo dueño."]},{"id":"11-O4-P3","tipo":"opcion","enunciado":"¿Cómo cierras?","opciones":["Le cuento quién la hace (AROIL es de Biofactor S.A., fabricante ecuatoriano) y le propongo llevarla en la viscosidad y norma de su manual","Le cambio a la marca que conoce aunque no cumpla la norma","Le digo que busque la marca en internet y vuelva","Le regalo una muestra y no le vendo nada"],"correcta":0,"cita":"Marca de lubricantes de Biofactor S.A., fabricante ecuatoriano.","fuente":{"vista":"v-marcas","sub":"mk1","texto":"Marcas › Las 5 del 80 %","bloque":"mk1.6"},"paso":"Cierra con una propuesta","explicaciones":["Presentas la marca con lo que dice el manual y cierras con una propuesta concreta.","Nunca por debajo de la norma que pide el manual.","Lo mandas a otro lado y pierdes la venta.","Sin propuesta no hay cierre."]}],"manual":[{"f":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual? Vendes: el intervalo, no el envase. Si el cliente compara precio de galón, cámbiale la métrica a costo por kilómetro.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario"}},{"f":"En un envase hay siempre **dos datos**: la viscosidad SAE y la norma API. **La viscosidad la manda el fabricante del motor; la norma se elige igual o superior a la del manual.** Con eso respondes casi cualquier consulta.","fuente":{"vista":"v-lubricantes","sub":"lu3","texto":"Lubricantes › Las siglas"}},{"f":"En un envase de motor busca tres cosas: la viscosidad SAE (20W-50, por ejemplo), la norma de desempeño API (SP, SN, CK-4) y el tipo de base (mineral, semisintético, sintético). En moto agrega la JASO (MA2 o MB). Con esas tres o cuatro líneas ya sabes si el producto calza con el vehículo.","fuente":{"qa":"leer envase etiqueta interpretar galon","texto":"Banco de respuestas del manual"}},{"f":"Marca de lubricantes de Biofactor S.A., fabricante ecuatoriano. Sus líneas públicas son Motor 4T, Ultra Diesel, Hydraulic, Argear (engranajes) y Ardrill.","fuente":{"vista":"v-marcas","sub":"mk1","texto":"Marcas › Las 5 del 80 %"}},{"f":"El fabricante detrás de Aroil. Producción nacional: mejor precio, menor plazo de reposición y menos exposición a tipo de cambio o aduana.","fuente":{"vista":"v-marcas","sub":"mk1","texto":"Marcas › Las 5 del 80 %"}}]},{"id":"11-O5","titulo":"Intervalo estirado","cliente":"Todavía tiene nivel, lo cambio más adelante.","situacion":"El cliente ya pasó el kilometraje de cambio y te dice:","pasos":[{"id":"11-O5-P1","tipo":"opcion","enunciado":"¿Qué haces primero?","opciones":["Pregunto qué vehículo es, cuántos kilómetros tiene y qué dice el manual","Le digo que está bien y que vuelva después","Le vendo un aditivo para estirar el cambio","Le digo que mire el color del aceite"],"correcta":0,"cita":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual?","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloque":"ve1.1"},"paso":"Pregunta antes de opinar","explicaciones":["Con el kilometraje y el manual sabes cuánto se pasó del intervalo.","Así el motor sigue con un aceite que ya no protege.","El manual no dice que un aditivo estire el intervalo.","El color no dice si el aceite todavía protege."]},{"id":"11-O5-P2","tipo":"opcion","enunciado":"¿Qué le explicas?","opciones":["El aceite no se acaba, se gasta por dentro: aunque el nivel esté bien, si pasó el intervalo ya no protege","Que tiene razón: si hay nivel, todo bien","Que el aceite solo se gasta cuando baja el nivel","Que con un buen aceite el intervalo se estira lo que uno quiera"],"correcta":0,"cita":"El aceite no se acaba, se gasta por dentro. Aunque el nivel esté bien, si pasó el intervalo ya no protege.","fuente":{"vista":"v-lubricantes","sub":"lu6","texto":"Lubricantes › Si no se cambia","bloque":"lu6.10"},"paso":"Argumenta con el manual","explicaciones":["Es la frase del manual para esta situación, y es literalmente cierta.","Lo que se agota es el paquete de aditivos, no el nivel.","Falso: se gasta por dentro aunque el nivel esté bien.","Manda el manual del vehículo, y en turbo el intervalo no se estira nunca."]},{"id":"11-O5-P3","tipo":"opcion","enunciado":"¿Cómo cierras?","opciones":["Le propongo hacer el cambio ahora con filtro nuevo: nunca sale un lubricante solo de tu pedido","Le digo que vuelva cuando se encienda el testigo","Le vendo medio galón para completar el nivel","Le recomiendo esperar a que el motor suene"],"correcta":0,"cita":"Nunca sale un lubricante solo de tu pedido.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloque":"ve1.2"},"paso":"Cierra con una propuesta","explicaciones":["Propuesta concreta, y con el filtro proteges el aceite que acaba de comprar.","Cuando el cliente nota los síntomas, el daño ya empezó.","Completar nivel no devuelve los aditivos que se agotaron.","Esperar síntomas es esperar el daño."]}],"manual":[{"f":"Pregunta: ¿qué vehículo, cuántos kilómetros tiene y qué dice el manual? Vendes: el intervalo, no el envase. Si el cliente compara precio de galón, cámbiale la métrica a costo por kilómetro.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario"}},{"f":"\"El aceite no se acaba, se gasta por dentro. Aunque el nivel esté bien, si pasó el intervalo ya no protege.\" Esa frase convierte el \"todavía tiene nivel\" en una venta, y es literalmente cierta.","fuente":{"vista":"v-lubricantes","sub":"lu6","texto":"Lubricantes › Si no se cambia"}},{"f":"El aceite no se \"gasta\" como la gasolina: **lo que se agota es el paquete de aditivos**. Los detergentes se consumen, los dispersantes se saturan de hollín, los antioxidantes se acaban. Queda base sin propiedades. Por eso hay intervalo de cambio.","fuente":{"vista":"v-lubricantes","sub":"lu2","texto":"Lubricantes › De qué está hecho › Los aditivos: qué hace cada uno"}},{"f":"Depende de la base. Mineral: 3.000 a 5.000 km. Semisintético: 5.000 a 7.500. Sintético: 7.500 a 10.000 o más. Esos son rangos de referencia — el que manda es el manual del vehículo. Y en uso severo (taxi, ciudad, polvo, taxi de altura, remolque) se acorta. En turbo el intervalo no se estira nunca.","fuente":{"qa":"cada cuanto cambia aceite intervalo kilometraje km","texto":"Banco de respuestas del manual"}},{"f":"Sube el consumo de combustible. Baja la potencia. Ruido de motor. Huele a quemado o sale humo. Se enciende el testigo del aceite. **Cuando el cliente nota estos síntomas, el daño ya empezó.**","fuente":{"vista":"v-lubricantes","sub":"lu6","texto":"Lubricantes › Si no se cambia"}},{"f":"Pregunta: ¿cuándo cambió el de cabina? Vendes: protección del aceite que acaba de comprar. Nunca sale un lubricante solo de tu pedido.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario"}}]},{"id":"11-O6","titulo":"Póngame el del carro (moto)","cliente":"Póngame el del carro, es más barato.","situacion":"Un cliente con moto de cambios pide aceite y te dice:","pasos":[{"id":"11-O6-P1","tipo":"opcion","enunciado":"¿Qué preguntas primero?","opciones":["¿Es 2T o 4T, y tiene embrague o es automática?","¿Cuánto quiere gastar?","Nada: le vendo el del carro","¿De qué color es la moto?"],"correcta":0,"cita":"Pregunta: ¿es 2T o 4T, y tiene embrague o es automática?","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario","bloque":"ve1.5"},"paso":"Pregunta antes de opinar","explicaciones":["Es la pregunta del manual para el aceite de moto: cambia el producto por completo.","El presupuesto no dice qué norma necesita el embrague.","Así el error se paga con un embrague.","No tiene nada que ver con el aceite."]},{"id":"11-O6-P2","tipo":"opcion","enunciado":"Es 4T de cambios. ¿Qué le explicas?","opciones":["El aceite de carro lleva modificadores de fricción: en una moto de embrague húmedo hace que el embrague patine. Por eso existe la JASO","Que el aceite de carro es demasiado espeso","Que da lo mismo, pero el de moto huele mejor","Que la moto no tiene cárter"],"correcta":0,"cita":"El aceite de auto lleva modificadores de fricción para ahorrar combustible. En una moto de embrague húmedo eso hace que el embrague patine.","fuente":{"vista":"v-motos","sub":"mo6","texto":"Motos › Auto vs. moto","bloque":"mo6.11"},"paso":"Argumenta con el manual","explicaciones":["Es el argumento del manual.","El problema no es la viscosidad: son los modificadores de fricción.","No da lo mismo: el embrague patina.","Falso: la moto 4T sí tiene cárter."]},{"id":"11-O6-P3","tipo":"opcion","enunciado":"¿Cómo cierras?","opciones":["«Es medio litro de diferencia en precio contra un embrague», y le ofreces el JASO MA2 en la viscosidad de su manual","Le vendes el del carro para no perder la venta","Le dices que mezcle mitad y mitad","Le recomiendas no cambiar el aceite todavía"],"correcta":0,"cita":"Es medio litro de diferencia en precio contra un embrague.","fuente":{"vista":"v-motos","sub":"mo6","texto":"Motos › Auto vs. moto","bloque":"mo6.13"},"paso":"Cierra con una propuesta","explicaciones":["Es la frase del manual, con propuesta concreta.","Ganas una venta y pierdes un cliente cuando patine el embrague.","Sigue llevando modificadores de fricción.","No responde la objeción."]}],"manual":[{"f":"Pregunta: ¿es 2T o 4T, y tiene embrague o es automática? Vendes: la norma JASO correcta. Aquí el error se paga con un embrague.","fuente":{"vista":"v-vender","sub":"ve1","texto":"Vender › El argumentario"}},{"f":"Menos aceite, más revoluciones, más calor y tres trabajos en vez de uno.","fuente":{"vista":"v-motos","sub":"mo6","texto":"Motos › Auto vs. moto"}},{"f":"El aceite de auto lleva modificadores de fricción para ahorrar combustible. En una moto de embrague húmedo eso hace que **el embrague patine**.","fuente":{"vista":"v-motos","sub":"mo6","texto":"Motos › Auto vs. moto"}},{"f":"Por eso existe la norma JASO. Un aceite de carro no la tiene.","fuente":{"vista":"v-motos","sub":"mo6","texto":"Motos › Auto vs. moto"}},{"f":"«Es medio litro de diferencia en precio contra un embrague. Y el embrague cuesta lo que treinta cambios de aceite.»","fuente":{"vista":"v-motos","sub":"mo6","texto":"Motos › Auto vs. moto"}},{"f":"**Qué aceite se usa:** Moto de cambios (4T): **JASO MA2** en la viscosidad del manual — en Ecuador casi siempre **20W-50**. Scooter automático: **JASO MB**. Motor 2T: **JASO FD o API TC**, en la proporción que indique el fabricante.","fuente":{"vista":"v-motos","sub":"mo0","texto":"Motos › Motos"}}]}],"intro":"La línea principal del negocio. Todo lo que hay que entender, de lo básico a lo técnico."},{"codigo":10,"nombre":"Filtros","niveles":[],"objeciones":[]},{"codigo":15,"nombre":"Aditivos","niveles":[],"objeciones":[]},{"codigo":20,"nombre":"Líquido de freno","niveles":[],"objeciones":[]},{"codigo":19,"nombre":"Grasas","niveles":[],"objeciones":[]},{"codigo":13,"nombre":"Refrigerantes","niveles":[],"objeciones":[]},{"codigo":17,"nombre":"Baterías","niveles":[],"objeciones":[]},{"codigo":18,"nombre":"Bujías","niveles":[],"objeciones":[]}],"contextoIA":["PORTAFOLIO. Cinco marcas hacen el 80% del presupuesto: STARKE (marca propia, línea principal), AROIL, BIOFACTOR, CASTROL y MOTUL. Aroil es la marca de Biofactor S.A. (fabricante ecuatoriano): son el MISMO proveedor, así que el 80% se apoya sobre tres proveedores externos.","Castrol es de BP (GTX, GTX Magnatec full sintético 0W-20/5W-20/5W-30/10W-30, Actevo de moto). Motul es francesa, especialista en moto: 3000 mineral, 5100 semisintético (API SN, JASO MA2), 7100 100% sintético (API SP, JASO MA2), 300V de competición SIN homologación JASO.","FUNDAMENTOS. SAE = Society of Automotive Engineers; mide VISCOSIDAD; norma J300 con la escala 0W a 25W y grados 20 a 50; no dice nada de calidad. API = American Petroleum Institute; mide DESEMPEÑO; S para gasolina, C para diésel; también clasifica bases en grupos I a V. Escalera gasolina SF, SL, SM, SN, SN Plus, SP, SQ (SQ desde marzo 2025). Diésel CF, CF-4, CH-4, CI-4, CJ-4, CK-4; FA-4 es aparte y NO intercambiable. ILSAC GF-5/6/7. JASO: 2T FB/FC/FD; 4T MA y MA2 con embrague húmedo, MB para scooter automático. ACEA europea. NLGI grasas 000 a 6, la 2 es multipropósito y la 3 para rodamiento de rueda; punto de gota = temperatura a la que se licua. ISO VG hidráulicos 32/46/68/100/150/220. DOT líquido de freno.","20W-50: el 20W es el grado en frío (W de Winter, invierno, no peso ni temperatura); el 50 es a 100°C. La viscosidad la manda el fabricante del motor. Un 80W-90 de transmisión (J306) no es más espeso que un 20W-50 de motor (J300): escalas distintas, equivalen aproximadamente.","COMPOSICIÓN: 70-90% base + 10-30% aditivos. Bases API: I y II minerales, III mineral muy refinado que se vende como sintético, IV PAO sintético real, V ésteres y especiales. Aditivos: detergentes, dispersantes, antidesgaste (ZDDP), antioxidantes, mejoradores del índice de viscosidad (hacen posible el multigrado), modificadores de fricción (hacen patinar el embrague de moto), inhibidores de corrosión, antiespumantes, depresores del punto de fluidez. Lo que se agota es el paquete de aditivos.","MOTOR 4T: admisión, compresión, expansión (único tiempo que produce fuerza) y escape; cuatro carreras, dos vueltas de cigüeñal. 2T: ciclo en dos carreras, una vuelta; el aceite va mezclado con la gasolina y se quema: se consume siempre; sin cárter ni filtro. CÁRTER: depósito bajo del motor; capacidades típicas auto 3-5 L, camioneta 5-7, moto 0,8-1,5, camión 15-40; sobrellenar hace espuma y la espuma no lubrica. CIRCUITO: cárter, bomba, filtro, regulador, galerías, piezas móviles, enfriador y vuelta al cárter; el mayor desgaste ocurre en el arranque en frío.","SIN CAMBIO DE ACEITE: se agotan aditivos, se oxida y espesa, aparecen lodos, se tapan galerías, sube el desgaste, sobrecalienta y falla.","TURBO: 200.000 rpm, gases sobre 1.000°C; la coquización tapa los conductos si se apaga en caliente; sintético en el grado del manual, sin estirar intervalos, filtro nuevo siempre; LSPI es lo que atacan API SP y SQ.","VENTA: se vende en canastas (lubricante arrastra filtro, filtro abre mantenimiento, mantenimiento arrastra refrigerante y freno); el indicador es líneas por factura; al sintético se sube vendiendo kilómetro protegido; subir de galón a balde es más barato que un cliente nuevo."]}</script>
<script>
(function(){
  "use strict";

  /* ============ VERSIÓN ============ */
  /* Única fuente de la versión. Se ve en el menú, nombra la caché del service worker
     (sw.js?v=N → cachés academia-vN y academia-vN-fuentes) y sirve para avisar cuando hay una nueva.
     Súbela en cada publicación. */
  var VERSION = { n: 1, fecha: "01-10-2026" };

  /* ============ REGLAS ============ */
  var NOTA_MINIMA = 0.75;              /* para aprobar una lección (3 de 4, 4 de 5) */
  var NOTA_EXAMEN = 0.8;               /* para aprobar el examen final */
  var PREGUNTAS_EXAMEN = 20;
  var MAX_REPASO_DIA = 10;
  var CAJAS_DIAS = [1, 2, 4, 8, 16];   /* caja 1 a 5: a cuántos días vuelve la pregunta */
  var PRACTICA_SIN_VENCIDAS = 5;       /* si hoy no vence nada, práctica corta para no perder la racha */
  var MANUAL_URL = "https://diegobarcoello-maker.github.io/manual-austrofil/";

  var DATA = {};
  try { DATA = JSON.parse(document.getElementById("datos-academia").textContent || "{}"); } catch (e){ DATA = {}; }
  var LINEAS = DATA.lineas || [];
  var root = document.documentElement;
  var app = document.getElementById("app");

  /* ============ AYUDAS ============ */
  function $(sel, el){ return (el || document).querySelector(sel); }
  function add(el, c){
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)){ c.forEach(function(x){ add(el, x); }); return; }
    if (typeof c === "string" || typeof c === "number") el.appendChild(document.createTextNode(String(c)));
    else el.appendChild(c);
  }
  function h(tag, at){
    var el = document.createElement(tag);
    if (at) Object.keys(at).forEach(function(k){
      var v = at[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  /* texto del manual con **negritas** */
  function rich(t){
    var f = document.createDocumentFragment();
    String(t || "").split("**").forEach(function(part, i){
      if (!part) return;
      f.appendChild(i % 2 ? h("b", null, part) : document.createTextNode(part));
    });
    return f;
  }
  function plano(t){ return String(t || "").replace(/\*\*/g, ""); }
  function icon(id, cls){
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    if (cls) s.setAttribute("class", cls);
    s.setAttribute("aria-hidden", "true");
    var u = document.createElementNS("http://www.w3.org/2000/svg", "use");
    u.setAttribute("href", "#" + id);
    s.appendChild(u);
    return s;
  }
  function barajar(a){
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b){ return b ? Math.round(a * 100 / b) : 0; }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function isoLocal(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function hoy(){ return isoLocal(new Date()); }
  function sumarDias(iso, n){
    var p = iso.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2], 12);
    d.setDate(d.getDate() + n);
    return isoLocal(d);
  }
  function diasEntre(a, b){
    var pa = a.split("-"), pb = b.split("-");
    return Math.round((Date.UTC(+pb[0], +pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], +pa[1] - 1, +pa[2])) / 864e5);
  }
  function fechaEc(iso){ var p = String(iso || "").split("-"); return p.length === 3 ? p[2] + "-" + p[1] + "-" + p[0] : ""; }
  function limpio(t, max){ return String(t === undefined || t === null ? "" : t).replace(/\s+/g, " ").trim().slice(0, max || 400); }

  /* ============ GUARDADO (solo en este celular, claves academia.*) ============ */
  var K = { nombre: "academia.nombre", progreso: "academia.progreso", repaso: "academia.repaso",
            racha: "academia.racha", ajustes: "academia.ajustes" };
  function lsGet(k){ try { return localStorage.getItem(k) || ""; } catch (e){ return ""; } }
  function lsSet(k, v){
    try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); return true; }
    catch (e){ return false; }
  }
  function leerJSON(k){ try { var v = JSON.parse(lsGet(k) || "null"); return v && typeof v === "object" ? v : null; } catch (e){ return null; } }
  var ST = {};
  function cargarEstado(){
    ST.nombre = limpio(lsGet(K.nombre), 60);
    var p = leerJSON(K.progreso) || {};
    ST.progreso = { v: 1, lecciones: p.lecciones || {}, examenes: p.examenes || {}, stats: p.stats || {}, objeciones: p.objeciones || {} };
    var r = leerJSON(K.repaso) || {};
    ST.repaso = { v: 1, items: r.items || {}, fijas: r.fijas || {}, dia: r.dia || "", hechas: r.hechas || 0, hecho: r.hecho || "" };
    var ra = leerJSON(K.racha) || {};
    ST.racha = { v: 1, dias: ra.dias || 0, ultimo: ra.ultimo || "", mejor: ra.mejor || 0 };
    var a = leerJSON(K.ajustes) || {};
    ST.ajustes = { v: 1, tema: a.tema || "auto", linea: a.linea || null };
  }
  function guardar(){
    lsSet(K.progreso, JSON.stringify(ST.progreso));
    lsSet(K.repaso, JSON.stringify(ST.repaso));
    lsSet(K.racha, JSON.stringify(ST.racha));
    lsSet(K.ajustes, JSON.stringify(ST.ajustes));
  }
  cargarEstado();

  var persistente = null;
  function pedirPersistencia(){
    try {
      if (!navigator.storage || !navigator.storage.persist) return;
      navigator.storage.persisted().then(function(ya){ return ya || navigator.storage.persist(); })
        .then(function(ok){ persistente = !!ok; }).catch(function(){});
    } catch (e){}
  }

  /* ============ ÍNDICES DE LA RUTA ============ */
  var LEC = {}, PREG = {}, OBJ = {};
  LINEAS.forEach(function(l){
    l.niveles = l.niveles || [];
    l.objeciones = l.objeciones || [];
    l.activa = l.niveles.length > 0;
    l.niveles.forEach(function(n, ni){
      n.linea = l; n.idx = ni;
      n.modulos.forEach(function(m){
        m.nivel = n;
        m.lecciones.forEach(function(x){
          x.modulo = m; x.nivel = n; x.linea = l; LEC[x.id] = x;
          x.preguntas.forEach(function(p){ p.leccion = x; PREG[p.id] = p; });
        });
      });
    });
    l.objeciones.forEach(function(o){ o.linea = l; OBJ[o.id] = o; });
  });
  function lineaPorCodigo(c){ for (var i = 0; i < LINEAS.length; i++) if (String(LINEAS[i].codigo) === String(c)) return LINEAS[i]; return null; }
  function lineaActual(){
    var l = lineaPorCodigo(ST.ajustes.linea);
    if (l && l.activa) return l;
    for (var i = 0; i < LINEAS.length; i++) if (LINEAS[i].activa) return LINEAS[i];
    return LINEAS[0] || null;
  }
  function leccionesDe(n){ var o = []; n.modulos.forEach(function(m){ o = o.concat(m.lecciones); }); return o; }
  function leccionesLinea(l){ var o = []; l.niveles.forEach(function(n){ o = o.concat(leccionesDe(n)); }); return o; }
  function preguntasLinea(l){ var o = []; leccionesLinea(l).forEach(function(x){ o = o.concat(x.preguntas); }); return o; }
  function lecOk(id){ var r = ST.progreso.lecciones[id]; return !!(r && r.ok); }
  function nivelOk(n){ return leccionesDe(n).every(function(x){ return lecOk(x.id); }); }
  function nivelAbierto(n){ return n.idx === 0 || nivelOk(n.linea.niveles[n.idx - 1]); }
  function aprobadasEn(lista){ return lista.filter(function(x){ return lecOk(x.id); }).length; }
  function lineaOk(l){ return l.activa && l.niveles.every(nivelOk); }
  function examen(l){ return ST.progreso.examenes[l.codigo] || null; }
  function siguienteLeccion(l){
    for (var i = 0; i < l.niveles.length; i++){
      var n = l.niveles[i];
      if (!nivelAbierto(n)) return null;
      var ls = leccionesDe(n);
      for (var j = 0; j < ls.length; j++) if (!lecOk(ls[j].id)) return ls[j];
    }
    return null;
  }

  /* ============ RACHA Y REPASO (cajas) ============ */
  function rachaActual(){
    if (!ST.racha.ultimo) return 0;
    var d = diasEntre(ST.racha.ultimo, hoy());
    return d <= 1 && d >= 0 ? ST.racha.dias : 0;
  }
  function marcarRepasoHecho(){
    var t = hoy();
    if (ST.racha.ultimo === t) return;
    ST.racha.dias = (ST.racha.ultimo && diasEntre(ST.racha.ultimo, t) === 1) ? ST.racha.dias + 1 : 1;
    ST.racha.ultimo = t;
    ST.racha.mejor = Math.max(ST.racha.mejor || 0, ST.racha.dias);
    ST.repaso.hecho = t;
  }
  function hechasHoy(){ return ST.repaso.dia === hoy() ? ST.repaso.hechas : 0; }
  function contarHecha(){
    var t = hoy();
    if (ST.repaso.dia !== t){ ST.repaso.dia = t; ST.repaso.hechas = 0; }
    ST.repaso.hechas++;
  }
  /* falló: a la caja 1, vuelve mañana */
  function aCaja1(id){
    if (!PREG[id]) return;
    delete ST.repaso.fijas[id];
    ST.repaso.items[id] = { c: 1, d: sumarDias(hoy(), CAJAS_DIAS[0]) };
  }
  /* acertó en una lección aprobada: entra a la caja 2 si todavía no estaba */
  function entrarCaja2(id){
    if (!PREG[id] || ST.repaso.items[id] || ST.repaso.fijas[id]) return;
    ST.repaso.items[id] = { c: 2, d: sumarDias(hoy(), CAJAS_DIAS[1]) };
  }
  /* respuesta en el repaso: sube de caja o vuelve a la 1; tras la caja 5 queda fija */
  function moverCaja(id, ok){
    var it = ST.repaso.items[id];
    if (!ok){ aCaja1(id); return; }
    if (!it) return;
    if (it.c >= CAJAS_DIAS.length){ delete ST.repaso.items[id]; ST.repaso.fijas[id] = hoy(); return; }
    it.c += 1;
    it.d = sumarDias(hoy(), CAJAS_DIAS[it.c - 1]);
  }
  function vencidas(){
    var t = hoy();
    return Object.keys(ST.repaso.items).filter(function(id){ return PREG[id] && ST.repaso.items[id].d <= t; })
      .sort(function(a, b){
        var A = ST.repaso.items[a], B = ST.repaso.items[b];
        return A.c - B.c || (A.d < B.d ? -1 : A.d > B.d ? 1 : 0);
      });
  }
  function porCaja(){
    var c = [0, 0, 0, 0, 0];
    Object.keys(ST.repaso.items).forEach(function(id){ if (PREG[id]) c[Math.min(5, ST.repaso.items[id].c) - 1]++; });
    return c;
  }
  function anotar(id, ok){
    var s = ST.progreso.stats[id] || [0, 0];
    s[ok ? 0 : 1]++;
    ST.progreso.stats[id] = s;
  }
  /* módulos con más errores, para "temas flojos" */
  function temasFlojos(l){
    var out = [];
    l.niveles.forEach(function(n){ n.modulos.forEach(function(m){
      var ok = 0, mal = 0, enCaja1 = 0;
      m.lecciones.forEach(function(x){ x.preguntas.forEach(function(p){
        var s = ST.progreso.stats[p.id]; if (s){ ok += s[0]; mal += s[1]; }
        var it = ST.repaso.items[p.id]; if (it && it.c === 1) enCaja1++;
      }); });
      var tot = ok + mal;
      if ((tot >= 3 && mal / tot > 0.25) || enCaja1 >= 2) out.push({ t: m.titulo, r: tot ? mal / tot : 0, c: enCaja1 });
    }); });
    out.sort(function(a, b){ return b.r - a.r || b.c - a.c; });
    return out.slice(0, 3).map(function(x){ return x.t; });
  }

  /* ============ TEMA ============ */
  function aplicarTema(){
    var t = ST.ajustes.tema;
    if (t === "claro") root.setAttribute("data-theme", "light");
    else if (t === "oscuro") root.setAttribute("data-theme", "dark");
    else root.removeAttribute("data-theme");
  }
  aplicarTema();

  /* ============ MENÚ, PESTAÑAS, AVISOS ============ */
  var drawer = $("#drawer"), scrim = $("#scrim"), burger = $("#burger");
  function abrirMenu(on){
    drawer.classList.toggle("on", on); scrim.classList.toggle("on", on);
    burger.setAttribute("aria-expanded", on ? "true" : "false");
  }
  burger.addEventListener("click", function(){ abrirMenu(true); });
  $("#dclose").addEventListener("click", function(){ abrirMenu(false); });
  scrim.addEventListener("click", function(){ abrirMenu(false); });
  var dver = $("#dver");
  dver.textContent = "";
  add(dver, ["Versión ", h("b", null, String(VERSION.n)), " · " + VERSION.fecha]);

  function pintarMenu(){
    var nav = $("#dnav"), l = lineaActual(), r = ruta()[0];
    nav.textContent = "";
    var items = [
      ["ruta", "🛣️", "Ruta de aprendizaje"], ["repaso", "🔁", "Repaso diario"],
      ["simulador", "💬", "Simulador de objeciones"],
      l && l.activa ? ["examen/" + l.codigo, "🎓", "Examen final"] : null,
      ["avance", "📊", "Mi avance y respaldo"], ["ajustes", "⚙️", "Ajustes e IA"]
    ];
    items.forEach(function(it){
      if (!it) return;
      nav.appendChild(h("button", { class: "di" + (r === it[0].split("/")[0] ? " on" : ""), onclick: function(){ abrirMenu(false); ir(it[0]); } },
        h("span", { class: "em" }, it[1]), h("span", null, it[2])));
    });
    nav.appendChild(h("a", { class: "di", href: MANUAL_URL, target: "_blank", rel: "noopener" },
      h("span", { class: "em" }, "📘"), h("span", null, "Abrir el Manual de Campo ↗")));
  }
  [].forEach.call(document.querySelectorAll(".tab"), function(b){
    b.addEventListener("click", function(){ ir(b.getAttribute("data-tab")); });
  });
  function pintarTabs(){
    var r = ruta()[0];
    var tab = { ruta: "ruta", leccion: "ruta", examen: "ruta", certificado: "ruta", repaso: "repaso",
                simulador: "simulador", objecion: "simulador", avance: "avance", ajustes: "avance" }[r] || "ruta";
    [].forEach.call(document.querySelectorAll(".tab"), function(b){
      b.classList.toggle("on", b.getAttribute("data-tab") === tab);
    });
    var n = Math.min(vencidas().length, Math.max(0, MAX_REPASO_DIA - hechasHoy()));
    var bd = $("#badge-repaso");
    bd.hidden = !n; bd.textContent = n ? String(n) : "";
  }
  function toast(t){
    var el = $("#toast");
    el.textContent = t; el.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(function(){ el.hidden = true; }, 3400);
  }
  /* hoja de confirmación propia (sin diálogos del navegador) */
  function confirmar(titulo, texto, si, no){
    return new Promise(function(res){
      var bg = h("div", { class: "sheet-bg", role: "dialog", "aria-modal": "true" });
      function fin(v){ bg.remove(); res(v); }
      bg.addEventListener("click", function(e){ if (e.target === bg) fin(false); });

  /* ============ LECCIÓN ============ */
  function pintarCuerpo(cuerpo){
    var out = h("div", { class: "cuerpo" }), i = 0;
    while (i < cuerpo.length){
      var b = cuerpo[i];
      if (b.t === "li"){
        var ul = h("ul");
        while (i < cuerpo.length && cuerpo[i].t === "li"){ ul.appendChild(h("li", null, rich(cuerpo[i].f))); i++; }
        out.appendChild(ul); continue;
      }
      if (b.t === "fila"){
        var box = h("div", { class: "filas" }), cols = JSON.stringify(b.cols || []);
        while (i < cuerpo.length && cuerpo[i].t === "fila" && JSON.stringify(cuerpo[i].cols || []) === cols){
          var f = cuerpo[i], cells = f.cells || [f.f], c0 = (f.cols || [])[0];
          /* "I" a secas no dice nada: con el encabezado de la columna queda "Grupo I" */
          var fila = h("div", { class: "fila" }, h("b", null, c0 && plano(cells[0]).length <= 4 ? c0 + " " : "", rich(cells[0])));
          cells.slice(1).forEach(function(c, k){
            var lbl = cells.length > 2 ? (f.cols || [])[k + 1] : "";
            fila.appendChild(h("span", { class: "c" }, lbl ? h("i", null, lbl) : null, rich(c)));
          });
          box.appendChild(fila); i++;
        }
        out.appendChild(box); continue;
      }
      if (b.t === "nota"){
        var call = h("div", { class: "call" + (b.k === "err" ? " err" : b.k === "src" ? " src" : "") });
        if (b.lbl) call.appendChild(h("span", { class: "lbl" }, b.lbl));
        var lbl0 = b.lbl;
        while (i < cuerpo.length && cuerpo[i].t === "nota" && cuerpo[i].lbl === lbl0){ call.appendChild(h("p", null, rich(cuerpo[i].f))); i++; }
        out.appendChild(call); continue;
      }
      if (b.t === "p") out.appendChild(h("p", { class: /lead/.test(b.cls || "") ? "lead" : null }, rich(b.f)));
      else if (b.t === "h3") out.appendChild(h("h3", null, plano(b.f)));
      else if (b.t === "h4") out.appendChild(h("h4", null, plano(b.f)));
      else if (b.t === "dato") out.appendChild(h("div", { class: "dato" }, rich(b.f)));
      else if (b.t === "def") out.appendChild(h("p", null, rich(b.f)));
      else if (b.t === "cabecera"){

      } else if (b.t === "marcas"){

        });

        out.appendChild(h("div", { class: "call qa" }, h("span", { class: "lbl" }, "Del banco de respuestas del manual"), h("p", null, rich(b.f))));
      } else out.appendChild(h("p", null, rich(b.f)));
      i++;

  /* ============ SESIONES DE PREGUNTAS ============ */
  /* tipos: "leccion" (cuenta para aprobar), "examen" (sin retroalimentación hasta el final),
     "repaso" (mueve las cajas), "ia" (práctica con preguntas de IA: no cuenta para nada) */
  var SES = null;
  function prep(p){
    var it = { p: p, sel: null, pares: {}, izqSel: null, hecho: false, ok: null };
    if (p.tipo === "opcion") it.orden = barajar(p.opciones.map(function(_, i){ return i; }));
    if (p.tipo === "emparejar"){
      it.izq = barajar(p.pares.map(function(_, i){ return i; }));
      it.der = barajar(p.pares.map(function(_, i){ return i; }));
    }
    return it;
  }
  function iniciar(tipo, preguntas, extra){
    SES = { tipo: tipo, items: preguntas.map(prep), i: 0, res: [], fin: false, feedback: tipo !== "examen" };
    Object.keys(extra || {}).forEach(function(k){ SES[k] = extra[k]; });
    if (SES.marcar) SES.items.forEach(SES.marcar);
    document.body.classList.add("sesion");
    if (location.hash === "#/quiz") render(); else location.hash = "#/quiz";
  }
  function ordenDistinto(lista, previo){
    if (lista.length < 2) return lista.slice();
    for (var t = 0; t < 10; t++){
      var o = barajar(lista);
      if (o.map(function(p){ return p.id; }).join() !== previo) return o;
    }
    return lista.slice().reverse();
  }
  function empezarLeccion(x, previo){
    iniciar("leccion", ordenDistinto(x.preguntas, previo || ""), { leccion: x });
  }
  function empezarExamen(l){
    var banco = preguntasLinea(l);   /* solo el banco fijo, nunca preguntas de IA */
    iniciar("examen", barajar(banco).slice(0, Math.min(PREGUNTAS_EXAMEN, banco.length)), { linea: l });
  }
  function empezarRepaso(){
    var cupo = MAX_REPASO_DIA - hechasHoy();
    if (cupo <= 0){ toast("Ya hiciste tus " + MAX_REPASO_DIA + " preguntas de hoy. Vuelve mañana."); return; }
    var ids = vencidas().slice(0, cupo), practica = false;
    if (!ids.length){
      var pool = [];
      LINEAS.forEach(function(l){ leccionesLinea(l).forEach(function(x){
        if (lecOk(x.id)) pool = pool.concat(x.preguntas.map(function(p){ return p.id; }));
      }); });
      if (!pool.length){ toast("Aprueba tu primera lección y empieza el repaso."); return; }
      ids = barajar(pool).slice(0, Math.min(PRACTICA_SIN_VENCIDAS, cupo));
      practica = true;
    }
    iniciar("repaso", ids.map(function(id){ return PREG[id]; }), { practica: practica, marcar: function(it){
      it.practica = practica;
      it.caja = (ST.repaso.items[it.p.id] || {}).c || 0;
    } });
  }
  function respondida(it){
    if (it.p.tipo === "emparejar") return Object.keys(it.pares).length === it.p.pares.length;
    return it.sel !== null;
  }
  function evaluar(it){
    var p = it.p;
    if (p.tipo === "emparejar") return p.pares.every(function(_, i){ return it.pares[i] === i; });
    return it.sel === p.correcta;
  }
  function correctaTexto(p){
    if (p.tipo === "opcion") return p.opciones[p.correcta];
    if (p.tipo === "vf") return p.correcta ? "Verdadero" : "Falso";
    return p.pares.map(function(x){ return x[0] + " → " + x[1]; }).join(" · ");
  }
  function dadaTexto(it){
    var p = it.p;
    if (p.tipo === "opcion") return it.sel === null ? "" : p.opciones[it.sel];
    if (p.tipo === "vf") return it.sel === null ? "" : (it.sel ? "Verdadero" : "Falso");
    /* en emparejar se muestran solo las parejas equivocadas */
    return p.pares.map(function(x, i){ var j = it.pares[i]; return j === i ? "" : x[0] + " → " + (j === undefined ? "?" : p.pares[j][1]); })
      .filter(Boolean).join(" · ");
  }
  function comprobar(){
    var it = SES.items[SES.i];
    if (!respondida(it) || it.hecho) return;
    it.hecho = true;
    it.ok = evaluar(it);
    SES.res.push({ id: it.p.id, ok: it.ok, it: it });
    if (!it.p.ia){
      anotar(it.p.id, it.ok);
      if (SES.tipo === "repaso"){
        if (it.practica){ if (!it.ok) aCaja1(it.p.id); }
        else moverCaja(it.p.id, it.ok);
        contarHecha();
      }
      guardar();
    }
    if (!SES.feedback){ siguiente(); return; }
    render();
  }
  function siguiente(){
    if (SES.i < SES.items.length - 1){ SES.i++; render(); window.scrollTo(0, 0); return; }
    terminar();
  }
  function terminar(){
    var bien = SES.res.filter(function(r){ return r.ok; }).length, total = SES.items.length;
    SES.bien = bien; SES.total = total; SES.pct = pct(bien, total); SES.fin = true;
    if (SES.tipo === "leccion"){
      var x = SES.leccion, r = ST.progreso.lecciones[x.id] || { ok: false, mejor: 0, intentos: 0 };
      var nivelAntes = nivelOk(x.nivel);
      SES.aprobado = bien / total >= NOTA_MINIMA;
      r.intentos = (r.intentos || 0) + 1; r.total = total; r.mejor = Math.max(r.mejor || 0, bien); r.ultimo = hoy();
      if (SES.aprobado && !r.ok){ r.ok = true; r.fecha = hoy(); }
      ST.progreso.lecciones[x.id] = r;
      SES.res.forEach(function(q){ if (!q.ok) aCaja1(q.id); else if (SES.aprobado) entrarCaja2(q.id); });
      SES.nivelNuevo = !nivelAntes && nivelOk(x.nivel);
    } else if (SES.tipo === "examen"){
      var l = SES.linea, e = ST.progreso.examenes[l.codigo] || { intentos: 0, mejor: 0 };
      SES.aprobado = bien / total >= NOTA_EXAMEN;
      e.intentos = (e.intentos || 0) + 1; e.total = total; e.mejor = Math.max(e.mejor || 0, bien);
      e.ultimo = { bien: bien, total: total, pct: SES.pct, fecha: hoy() };
      if (SES.aprobado){
        e.aprobado = true;
        if (!e.cert || SES.pct > e.cert.pct) e.cert = { bien: bien, total: total, pct: SES.pct, fecha: hoy() };
      }
      ST.progreso.examenes[l.codigo] = e;
      SES.res.forEach(function(q){ if (!q.ok) aCaja1(q.id); });
    } else if (SES.tipo === "repaso"){
      marcarRepasoHecho();
    }
    guardar();
    render();
  }
  function salirSesion(){
    if (SES && SES.tipo === "examen" && SES.res.length && !SES.fin){ history.back(); return; }
    var vuelta = SES && SES.leccion ? "leccion/" + SES.leccion.id : SES && SES.tipo === "repaso" ? "repaso" : "ruta";
    cerrarSesion(); ir(vuelta);

  function gotaCanvas(c, x, y, s, color, grosor){
    /* el mismo trazo de la gota del manual: M12 1C12 1 2 13 2 19.5A10 10 0 0 0 22 19.5C22 13 12 1 12 1Z */
    c.save(); c.translate(x - 12 * s, y - 1 * s); c.scale(s, s);
    c.beginPath(); c.moveTo(12, 1);
    c.bezierCurveTo(12, 1, 2, 13, 2, 19.5);
    c.arc(12, 19.5, 10, Math.PI, 0, true);

    c.lineWidth = grosor; c.strokeStyle = color; c.stroke(); c.restore();
  }

  function b64url(bytes){

    CLAVES_RESPALDO.forEach(function(k){ var v = lsGet(k); if (v) o.d[k] = v; });
    var bytes = new TextEncoder().encode(JSON.stringify(o)), pref = "AA0";
    if (window.CompressionStream){ try { bytes = await tubo(bytes, CompressionStream); pref = "AA1"; } catch (e){ pref = "AA0"; bytes = new TextEncoder().encode(JSON.stringify(o)); } }

  async function leerCodigo(t){
    t = String(t || "").replace(/\s+/g, "");
    var m = t.match(/^(AA[01])\.([A-Za-z0-9_-]+)\.([0-9a-z]{6})$/);
    if (!m) throw new Error("Ese texto no es un código de respaldo de la Academia. Cópialo completo.");
    if (suma(m[2]) !== m[3]) throw new Error("El código está incompleto o cambió una letra. Cópialo de nuevo, completo.");
    var bytes = deB64url(m[2]);
    if (m[1] === "AA1"){
      if (!window.DecompressionStream) throw new Error("Este navegador no puede leer el código. Actualiza Chrome.");
      bytes = await tubo(bytes, DecompressionStream);
    }
    var o = JSON.parse(new TextDecoder().decode(bytes));
    if (!o || o.a !== "academia" || !o.d || typeof o.d !== "object") throw new Error("Ese código no es de la Academia.");
    Object.keys(o.d).forEach(function(k){
      if (CLAVES_RESPALDO.indexOf(k) < 0 || typeof o.d[k] !== "string") throw new Error("El código trae datos que no reconozco.");
      if (k !== K.nombre) JSON.parse(o.d[k]);

  async function streamGem(model, contents, deep, out, signal, st){
    var cfg = { maxOutputTokens: deep ? 8192 : 4096 };

    var res = await fetch(GEM_URL + "models/" + encodeURIComponent(model) + ":streamGenerateContent?alt=sse", {
      method: "POST", signal: signal,

      var data = chunk.split("\n").filter(function(l){ return l.indexOf("data:") === 0; })

        if (p && !p.thought && typeof p.text === "string") st.text += p.text;
      });
      if (st.text){
        out.classList.remove("dots");

    for (;;){
      var r = await reader.read();
      if (r.done) break;
      buf += dec.decode(r.value, { stream: true }).replace(/\r/g, "");
      var parts = buf.split("\n\n");

    var st = { text: "" }, res = null, last = null;
    if (ctl) try { ctl.abort(); } catch (_){}
    ctl = new AbortController();
    var now = Date.now();
    var models = gemModels().filter(function(m){ return !(gemCool[m] && gemCool[m].until > now); });
    if (!models.length){
      throw { gem: "quota", daily: Object.keys(gemCool).some(function(m){ return gemCool[m].daily && gemCool[m].until > now; }) };
    }

  function validarIA(arr, x){

    if (!Array.isArray(arr)) return [];
    var out = [], sello = Date.now().toString(36);
    arr.forEach(function(q, i){

      var en = limpio(q.enunciado, 260), ex = limpio(q.explicacion, 300), base = { id: "ia-" + sello + "-" + i, enunciado: en, ia: true, cita: ex, leccion: x };

        if (!Array.isArray(q.opciones)) return;
        var op = q.opciones.map(function(o){ return limpio(o, 160); });
        if (op.length < 3 || op.length > 4 || op.some(function(o){ return !o; })) return;
        if (new Set(op.map(function(o){ return o.toLowerCase(); })).size !== op.length) return;
        if (typeof q.correcta !== "number" || !Number.isInteger(q.correcta) || q.correcta < 0 || q.correcta >= op.length) return;
        out.push(Object.assign(base, { tipo: "opcion", opciones: op, correcta: q.correcta }));
      } else if (q.tipo === "vf"){
        if (typeof q.correcta !== "boolean") return;
        out.push(Object.assign(base, { tipo: "vf", correcta: q.correcta }));
      } else if (q.tipo === "emparejar"){
        if (!Array.isArray(q.pares) || q.pares.length < 3 || q.pares.length > 4) return;

        if (iz.size !== pares.length || de.size !== pares.length) return;
        out.push(Object.assign(base, { tipo: "emparejar", pares: pares }));
      }
    });
    return out.slice(0, 5);
  }

      reg.addEventListener("updatefound", function(){ vigilar(reg.installing); });
      if (reg.waiting) reg.waiting.postMessage({ tipo: "activar" });
    }).catch(function(){ fallo("Sin conexión: intenta cuando tengas señal."); });
  });

  /* ============ ARRANQUE ============ */
  registrarSW();
  if (ST.nombre) pedirPersistencia();
  render();
})();
</script>
